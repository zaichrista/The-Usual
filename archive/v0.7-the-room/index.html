<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Usual</title>
<meta name="theme-color" content="#261F1D">
<meta name="description" content="Movies are better with someone. A film diary for the people you watch with.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE USUAL — prototype
   Palette is the owner's nine colours. Everything else is derived
   from them with color-mix, never a new hue.
   ============================================================ */
:root{
  --espresso:#261F1D; --cream:#F5E6D2; --champagne:#D8B596; --copper:#B77D55;
  --walnut:#78462F; --oxblood:#63352F; --gold:#E4C6A3; --mauve:#806C82; --blue:#9CAFCB;

  --font:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;
  --display:var(--font); --sans:var(--font); --cond:var(--font); --hand:var(--font);

  --unit:1; --rail:0px; --dockw:0px;
  --ease:cubic-bezier(.2,.8,.2,1);

  /* Materials (SVG noise, generated, no image files) */
  --wood:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='900' height='520'%3E%3Cfilter id='f' x='0' y='0' width='100%25' height='100%25'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.0032 0.2' numOctaves='5' seed='8'/%3E%3CfeColorMatrix values='0.55 0 0 0 0.17 0.34 0 0 0 0.085 0.22 0 0 0 0.045 0 0 0 0 1'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.3 -.12'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --brass:linear-gradient(135deg,var(--gold),var(--champagne) 40%,var(--copper) 75%,var(--champagne));
}
:root[data-theme="dark"]{
  --bg:var(--espresso);
  --bg2:color-mix(in srgb,var(--espresso),var(--walnut) 16%);
  --surface:color-mix(in srgb,var(--espresso),var(--walnut) 24%);
  --ink:var(--cream);
  --ink-soft:color-mix(in srgb,var(--cream) 66%,var(--espresso));
  --line:color-mix(in srgb,var(--cream) 16%,transparent);
  --accent:var(--copper); --accent-ink:var(--espresso);
  --link:var(--champagne);
  --wall:rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --bg:var(--cream);
  --bg2:color-mix(in srgb,var(--cream),var(--champagne) 30%);
  --surface:color-mix(in srgb,var(--cream),#fff 45%);
  --ink:var(--espresso);
  --ink-soft:color-mix(in srgb,var(--espresso) 72%,var(--cream));
  --line:color-mix(in srgb,var(--espresso) 18%,transparent);
  --accent:var(--oxblood); --accent-ink:var(--cream);
  --link:var(--oxblood);
  --wall:rgba(120,70,47,.12);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::after{ /* film grain over everything, very low */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:900;
  background:var(--grain);background-size:220px;opacity:.10;mix-blend-mode:overlay;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--link)}
img,svg{display:block;max-width:100%}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--champagne);outline-offset:3px;border-radius:2px}
[data-theme="light"] :focus-visible{outline-color:var(--oxblood)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.display{font-family:var(--font);font-weight:700;letter-spacing:-.03em;line-height:1.02}
.cap{font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.hand{font-style:italic;font-weight:500;font-size:1em;line-height:1.3}
.sub{color:var(--ink-soft);max-width:52ch}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.8em 1.25em;border-radius:3px;font:600 14px/1 var(--sans);letter-spacing:.04em;text-decoration:none;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 0 rgba(0,0,0,.35);
  transition:transform .15s var(--ease),filter .2s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--champagne)}
[data-theme="light"] .btn.ghost{box-shadow:inset 0 0 0 1px var(--oxblood)}
.btn.small{padding:.6em .9em;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--link);text-decoration:underline;text-underline-offset:3px;font-size:14px}

.chip{
  display:inline-flex;align-items:center;gap:.45em;padding:.5em .85em;border-radius:3px;
  font:600 12px/1 var(--cond);letter-spacing:.10em;text-transform:uppercase;
  box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-soft);transition:all .2s;
}
.chip:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--champagne)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- SHELL ---------- */
.shell{min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.main{min-width:0}
.rail{display:none}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
}
.wordmark{font:700 24px/1 var(--display);letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:.28em;white-space:nowrap}
.wordmark small{font:600 11px/1 var(--cond);letter-spacing:.20em;text-transform:uppercase;color:var(--champagne)}
[data-theme="light"] .wordmark small{color:var(--copper)}
.searchbtn{
  margin-left:auto;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-soft);font-size:14px;min-width:0
}
.searchbtn span{display:none}
.searchbtn kbd{display:none;font:600 11px var(--cond);letter-spacing:.1em;padding:2px 6px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--line)}
.searchbtn svg{width:18px;height:18px}
.avatar{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--brass);color:var(--espresso);font:700 15px var(--cond);letter-spacing:.04em;
  box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--champagne)
}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.tabbar{
  position:fixed;z-index:40;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 84px 1fr;
  align-items:end;padding:6px 8px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--bg) 70%,transparent);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;color:var(--ink-soft);font:600 11px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-2px;width:22px;height:2px;background:var(--brass)}
.plus{
  justify-self:center;width:62px;height:62px;border-radius:50%;margin-bottom:6px;position:relative;
  display:grid;place-items:center;color:var(--espresso);
  background:radial-gradient(circle at 32% 28%,var(--gold),var(--champagne) 38%,var(--copper) 80%);
  box-shadow:0 0 0 4px var(--bg),0 8px 18px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.25);
  transition:transform .2s var(--ease);
}
.plus:hover{transform:scale(1.06) rotate(90deg)}
.plus .ico{width:28px;height:28px;stroke-width:2}
.plus .pip{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--oxblood);box-shadow:0 0 0 2px var(--champagne)}

#view{padding:22px 16px 40px;max-width:1280px;margin:0 auto;outline:none}
.head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:clamp(34px,6vw,56px)}
.head .sub{margin-top:8px}

/* ---------- DESKTOP SHELL ---------- */
@media (min-width:1100px){
  :root{--unit:1.14;--rail:96px}
  .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);padding-bottom:0}
  .tabbar{display:none}
  .rail{
    display:flex;flex-direction:column;align-items:center;gap:6px;position:sticky;top:0;height:100dvh;
    padding:22px 0;border-right:1px solid var(--line);
    background:linear-gradient(90deg,var(--bg2),var(--bg));
  }
  .rail .wordmark{writing-mode:vertical-rl;transform:rotate(180deg);margin-bottom:22px;font-size:26px}
  .rail .tab{width:100%;padding:14px 4px}
  .rail .plus{margin:10px 0}
  .rail .grow{flex:1}
  .topbar .wordmark{display:none}
  .topbar{padding:14px 32px}
  .searchbtn{margin-left:0;min-width:320px;max-width:420px;flex:1}
  .searchbtn span{display:inline;flex:1;text-align:left}
  .searchbtn kbd{display:inline}
  .topbar .avatar{margin-left:auto}
  #view{padding:30px 32px 60px}
  body.dock-open .main{margin-right:var(--dockw)}
  :root{--dockw:0px}
  body.dock-open{--dockw:480px}
}
@media (min-width:768px) and (max-width:1099px){
  :root{--unit:1.06}
  #view{padding:28px 28px 40px}
  .searchbtn span{display:inline;flex:1;text-align:left;min-width:160px}
}

/* ---------- ROOM / WALL (paneling behind scenes) ---------- */
.wall{
  position:relative;
  background:
    repeating-linear-gradient(90deg,transparent 0 238px,var(--wall) 238px 241px),
    linear-gradient(180deg,color-mix(in srgb,var(--bg),var(--walnut) 10%),var(--bg));
}

/* ============================================================
   COVERS (generated; stands in for TMDB posters)
   ============================================================ */
.cover{
  container-type:inline-size;position:relative;aspect-ratio:135/190;overflow:hidden;
  background:var(--c-bg);color:var(--c-ink);border-radius:2px 3px 3px 2px;
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset;
}
.cv-art{position:absolute;inset:0;pointer-events:none}
.cv-sheen{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.4) 0,rgba(255,255,255,.14) 2.4%,rgba(0,0,0,.14) 4.4%,transparent 7%),
    linear-gradient(112deg,rgba(255,255,255,.26) 0,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 62%,rgba(255,255,255,.1) 100%)}
.cv-top{position:absolute;left:9cqw;right:7cqw;top:6.5cqw;display:flex;justify-content:space-between;
  font:600 4.9cqw/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.cv-title{position:absolute;left:9cqw;right:7cqw;bottom:14cqw;font:700 12.5cqw/.98 var(--display);text-wrap:balance}
.cv-title.m{font-size:10.5cqw}.cv-title.l{font-size:8.8cqw}
.cv-meta{position:absolute;left:9cqw;right:7cqw;bottom:6cqw;font:600 4.4cqw/1 var(--cond);letter-spacing:.15em;text-transform:uppercase;opacity:.85}
.cv-foil{position:absolute;right:5cqw;top:14cqw;width:15cqw;height:15cqw;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,var(--gold),var(--champagne) 45%,var(--copper));color:var(--espresso);
  font:700 5.6cqw/1 var(--cond);letter-spacing:.04em;box-shadow:0 1px 3px rgba(0,0,0,.45);transform:rotate(8deg)}
.cv-re{position:absolute;left:0;top:15cqw;padding:1.7cqw 3cqw 1.7cqw 9cqw;background:var(--oxblood);color:var(--cream);
  font:700 4.3cqw/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 1px 3px rgba(0,0,0,.4)}
/* templates */
.cv1 .cv-art::before{content:"";position:absolute;left:50%;top:21cqw;width:62cqw;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:linear-gradient(180deg,var(--c-b),var(--c-a))}
.cv1 .cv-art::after{content:"";position:absolute;left:0;right:0;top:56cqw;height:5cqw;background:var(--c-bg);box-shadow:0 7cqw 0 var(--c-bg),0 -3cqw 0 -2cqw var(--c-bg)}
.cv2 .cv-art{background:linear-gradient(152deg,transparent 54%,var(--c-a) 54%)}
.cv2 .cv-art::before{content:"";position:absolute;right:9cqw;top:19cqw;width:21cqw;aspect-ratio:1;border-radius:50%;border:1.4cqw solid var(--c-b)}
.cv2 .cv-title{bottom:auto;top:26cqw;right:34cqw;font-size:10.5cqw}
.cv2 .cv-title.l{font-size:8cqw}
.cv3 .cv-art{background:
  radial-gradient(circle at 26% 36%,var(--c-bg) 0 8cqw,var(--c-b) 8.4cqw 9.8cqw,transparent 10.2cqw),
  radial-gradient(circle at 54% 30%,var(--c-bg) 0 8cqw,var(--c-a) 8.4cqw 9.8cqw,transparent 10.2cqw),
  radial-gradient(circle at 80% 40%,var(--c-bg) 0 8cqw,var(--c-b) 8.4cqw 9.8cqw,transparent 10.2cqw)}
.cv3 .cv-art::before{content:"";position:absolute;left:9cqw;right:7cqw;top:52cqw;height:.6cqw;background:var(--c-a);opacity:.8}
.cv4 .cv-art::before{content:"";position:absolute;left:0;right:0;bottom:0;height:56%;
  background:repeating-linear-gradient(0deg,var(--c-a) 0 2.6cqw,transparent 2.6cqw 6cqw);opacity:.9}
.cv4 .cv-art::after{content:"";position:absolute;left:50%;bottom:44%;width:46cqw;height:23cqw;transform:translateX(-50%);
  border-radius:23cqw 23cqw 0 0;background:linear-gradient(0deg,var(--c-b),var(--c-a))}
.cv4 .cv-title{bottom:auto;top:27cqw}
.cv5 .cv-art::before{content:attr(data-i);position:absolute;left:50%;top:6cqw;transform:translateX(-50%);
  font:700 96cqw/1 var(--display);color:var(--c-a);opacity:.34}
.cv5 .cv-art::after{content:"";position:absolute;left:9cqw;right:7cqw;bottom:12cqw;height:.6cqw;background:var(--c-b)}
.cv6 .cv-art::before{content:"";position:absolute;left:50%;top:17cqw;width:54cqw;height:68cqw;transform:translateX(-50%);
  border-radius:27cqw 27cqw 0 0;background:var(--c-a)}
.cv6 .cv-art::after{content:"";position:absolute;left:50%;top:22cqw;width:44cqw;height:63cqw;transform:translateX(-50%);
  border-radius:22cqw 22cqw 0 0;background:linear-gradient(165deg,var(--blue),var(--mauve) 45%,var(--champagne))}
.cv6 .cv-title{bottom:12cqw;font-size:10.5cqw}.cv6 .cv-title.l{font-size:8.4cqw}

/* ============================================================
   SPINES
   ============================================================ */
.spine{
  --wpx:calc(var(--w)*var(--unit)*1px);
  position:relative;flex:none;width:var(--wpx);height:calc(var(--h)*var(--unit)*1px);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;
  background:var(--sb);color:var(--si);border-radius:2px 2px 1px 1px;
  transform-origin:50% 100%;transform:rotate(var(--lean,0deg));
  transition:transform .3s cubic-bezier(.2,.9,.3,1.25),filter .35s,opacity .35s;
  box-shadow:inset 1px 0 0 rgba(255,255,255,.16),inset -1px 0 0 rgba(0,0,0,.45),1px 0 3px rgba(0,0,0,.55);
}
.spine::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,0) 20%,rgba(255,255,255,.15) 46%,rgba(0,0,0,0) 64%,rgba(0,0,0,.44))}
.sp-cap{width:100%;flex:none;text-align:center;background:var(--sa);color:var(--sc,var(--espresso));
  font:700 calc(8px*var(--unit))/1 var(--cond);letter-spacing:.06em;padding:calc(4px*var(--unit)) 0}
.sp-title{flex:1;min-height:0;writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;overflow:hidden;
  font:700 calc(var(--fs,12)*var(--unit)*1px)/1 var(--font);letter-spacing:.05em;text-transform:uppercase;
  padding:calc(7px*var(--unit)) 0;display:flex;align-items:flex-start}
.sp-foot{width:100%;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:calc(8px*var(--unit))}
.sp-r{font:700 calc(9px*var(--unit))/1 var(--cond);letter-spacing:.04em;padding:2px 0;color:var(--si)}
.sp-re{width:calc(8px*var(--unit));height:calc(8px*var(--unit));border-radius:50%;background:var(--oxblood);box-shadow:0 0 0 1.5px var(--champagne)}
.sp-tab{position:absolute;left:0;right:0;bottom:0;height:calc(4px*var(--unit));z-index:3}
.spine.season{border-radius:2px 2px 1px 1px}
.spine.season .sp-title{letter-spacing:.06em}
.spine.season::after{content:"";position:absolute;left:12%;right:12%;top:calc(24px*var(--unit));height:1px;background:var(--si);opacity:.5;z-index:2}
.spine:hover,.spine:focus-visible{transform:translateY(-16px) rotate(0);z-index:5;filter:brightness(1.12)}
.spine.dim{opacity:.28;filter:grayscale(.85) brightness(.8)}
.spine.dim:hover{opacity:.9;filter:none}
.spine.landing{animation:land .9s var(--ease) both}
@keyframes land{0%{transform:translateY(-90px) rotate(-4deg);opacity:0}55%{opacity:1}75%{transform:translateY(4px)}100%{transform:rotate(var(--lean,0deg))}}

/* ============================================================
   SHELF SCREEN — the open cabinet
   ============================================================ */
.cabinet{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
.carcass,.door{min-width:0}
.carcass,.door{
  position:relative;background:var(--wood);background-size:900px 520px;
  box-shadow:0 30px 50px -10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(228,198,163,.18),inset 0 2px 0 rgba(228,198,163,.28);
}
.carcass{padding:0 16px 22px;border-radius:5px 5px 2px 2px;order:1}
.door{padding:46px 12px 18px;border-radius:3px;order:2}
.cornice{margin:0 -16px 14px;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;
  background:var(--wood);background-size:900px 520px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 6px 10px rgba(0,0,0,.35);
  border-radius:5px 5px 0 0;position:relative}
.cornice::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(228,198,163,.22),transparent 40%,rgba(0,0,0,.2));pointer-events:none;border-radius:inherit}
.plate{display:inline-block;padding:5px 12px 4px;background:var(--brass);color:var(--espresso);
  font:700 12px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.6)}
.door .plate{position:absolute;left:12px;top:12px}
.shelfset{
  background:linear-gradient(180deg,rgba(8,4,2,.86),rgba(8,4,2,.66)),var(--wood);background-size:auto,900px 520px;
  box-shadow:inset 0 14px 26px rgba(0,0,0,.75),inset 0 0 0 2px rgba(0,0,0,.45),inset 8px 0 14px -6px rgba(0,0,0,.7),inset -8px 0 14px -6px rgba(0,0,0,.7);
  padding:0 8px;border-radius:2px;
}
.row{position:relative}
.row-items{display:flex;align-items:flex-end;gap:1px;min-height:calc(208px*var(--unit));padding:calc(14px*var(--unit)) 4px 0;position:relative}
.row-items.bare{min-height:calc(160px*var(--unit))}
.board{height:15px;margin:0 -8px;background:var(--wood);background-size:900px 520px;position:relative;
  box-shadow:0 10px 14px rgba(0,0,0,.5),inset 0 -4px 6px rgba(0,0,0,.4)}
.board::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:rgba(228,198,163,.45)}
.hinge{position:absolute;width:12px;height:34px;background:var(--brass);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.hinge::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;transform:translateX(-50%);background:rgba(0,0,0,.45);border-radius:2px}
.door-l .hinge{right:-6px}.door-r .hinge{left:-6px}
.hinge.a{top:16%}.hinge.b{bottom:16%}
.reel{position:absolute;right:20px;top:-26px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle,var(--espresso) 0 5px,transparent 6px),
  conic-gradient(from 20deg,var(--copper),var(--champagne),var(--copper),var(--champagne),var(--copper),var(--champagne),var(--copper));
  box-shadow:0 3px 6px rgba(0,0,0,.6);display:none}
.reel::after{content:"";position:absolute;inset:7px;border-radius:50%;
  background:radial-gradient(circle at 50% 22%,var(--espresso) 0 5px,transparent 6px),radial-gradient(circle at 22% 62%,var(--espresso) 0 5px,transparent 6px),radial-gradient(circle at 78% 62%,var(--espresso) 0 5px,transparent 6px)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select.sel{background:var(--surface);border:0;padding:9px 12px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.seg{display:inline-flex;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.seg button{padding:9px 14px;font:600 12px/1 var(--cond);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{margin:6px 0 20px}
.count{font:600 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-left:auto;align-self:center}
.cabwrap{container-type:inline-size}
@container (min-width:560px){
  .cabinet{grid-template-columns:repeat(2,minmax(0,1fr))}
  .carcass{grid-column:1/-1}
}
@container (min-width:1040px){
  .cabinet{grid-template-columns:230px minmax(0,640px) 230px;justify-content:center;gap:0;margin-top:34px}
  .carcass{grid-column:auto;--unit:1.32;order:2;z-index:2}
  .door{order:1;perspective:900px;transform-origin:100% 50%;transform:perspective(1400px) rotateY(11deg);border-radius:3px 0 0 3px;margin-top:40px;z-index:1}
  .door.door-r{order:3;transform-origin:0 50%;transform:perspective(1400px) rotateY(-11deg);border-radius:0 3px 3px 0}
  .reel{display:block}
}
.cabwrap.single .cabinet{display:block;max-width:820px;margin:8px auto 0}
.cabwrap.single .carcass{--unit:1.2}

/* grid view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:26px 18px;margin-top:10px}
@media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.gcase{text-align:left;display:block;transition:transform .3s var(--ease),opacity .3s,filter .3s}
.gcase .cover{box-shadow:0 14px 24px -8px rgba(0,0,0,.65),0 2px 3px rgba(0,0,0,.5)}
.gcase:hover{transform:translateY(-6px) rotate(-.6deg)}
.gcase.dim{opacity:.28;filter:grayscale(.8)}
.gcase b{display:block;margin-top:10px;font:700 16px/1.15 var(--display)}
.gcase i{font:600 11px/1 var(--cond);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}


/* shelf props: every object stands on the board, with a contact shadow */
.prop{flex:none;margin-left:auto;margin-right:20px;align-self:flex-end;position:relative;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.prop::after{content:"";position:absolute;left:-8%;right:-8%;bottom:-2px;height:6px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 70%)}
.prop i{display:block;flex:none;position:relative;z-index:1}
.p-lamp{width:84px;height:calc(116px*var(--unit))}
.p-lamp::before{content:"";position:absolute;left:50%;top:-30%;width:240px;height:240px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 30%,transparent),transparent 64%)}
.p-lamp .sh{width:64px;height:44px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);background:linear-gradient(180deg,var(--cream),var(--gold) 55%,var(--champagne))}
.p-lamp .st{width:5px;flex:1 1 auto;background:var(--brass)}
.p-lamp .bs{width:46px;height:18px;clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);background:var(--brass)}
.p-stack{width:118px}
.p-stack i{height:17px;border-radius:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.2)}
.p-stack i:nth-child(1){order:3;width:116px;background:var(--oxblood)}
.p-stack i:nth-child(2){order:2;width:104px;background:var(--cream)}
.p-stack i:nth-child(3){order:1;width:110px;background:var(--mauve)}
.p-vase .nk{width:20px;height:24px;background:linear-gradient(90deg,var(--walnut),var(--copper),var(--walnut));border-radius:3px 3px 0 0}
.p-vase .bd{width:52px;height:60px;border-radius:50% 50% 44% 44%/58% 58% 42% 42%;background:radial-gradient(circle at 34% 30%,var(--champagne),var(--copper) 55%,var(--walnut))}
.p-frame{width:80px;height:calc(100px*var(--unit))}
.p-frame i{width:100%;height:100%;border:5px solid var(--walnut);box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 0 0 3px var(--cream);
  background:radial-gradient(circle at 50% 40%,var(--oxblood) 0 17px,transparent 18px),linear-gradient(180deg,var(--cream) 0 70%,var(--champagne) 70%)}

/* ============================================================
   DOCK / CASE DETAIL
   ============================================================ */
.dock{
  position:fixed;z-index:60;inset:0;overflow-y:auto;overscroll-behavior:contain;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  animation:sheetUp .45s var(--ease);
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@media (min-width:1100px){
  .dock{inset:0 0 0 auto;width:480px;border-left:1px solid var(--line);box-shadow:-30px 0 60px rgba(0,0,0,.35);animation:dockIn .45s var(--ease)}
  @keyframes dockIn{from{transform:translateX(60px);opacity:0}}
}
.dock-bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(6px)}
.stage{perspective:1500px;display:grid;place-items:center;padding:26px 0 34px;--cw:min(44vw,200px);overflow:hidden;position:relative}
@media(min-width:1100px){.stage{--cw:210px}}
.stage-floor{position:absolute;left:10%;right:10%;bottom:26px;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
.case{
  position:relative;width:var(--cw);height:calc(var(--cw)*1.407);transform-style:preserve-3d;
  --ry:-24deg;--rx:5deg;transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform 1s var(--ease);
}
.stage[data-s="open"] .case{--ry:-6deg;--rx:3deg;transform:translateX(calc(var(--cw)*.5)) rotateX(var(--rx)) rotateY(var(--ry))}
.stage[data-flip="1"] .case{--ry:156deg}
.f-front{position:absolute;inset:0;transform-origin:left center;transform:translateZ(13px);transform-style:preserve-3d;transition:transform 1s var(--ease)}
.stage[data-s="open"] .f-front{transform:translateZ(13px) rotateY(-162deg)}
.f-front>*{position:absolute;inset:0;backface-visibility:hidden}
.f-art .cover{width:100%;height:100%;aspect-ratio:auto;border-radius:2px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1)}
.f-art::after{content:"";position:absolute;inset:0;border-radius:2px;box-shadow:inset 0 0 0 3px rgba(20,12,10,.55);pointer-events:none}
.f-inner{transform:rotateY(180deg);background:var(--cream);color:var(--espresso);padding:calc(var(--cw)*.075);overflow:hidden;
  background-image:var(--grain);background-size:180px;background-blend-mode:multiply;border-radius:2px}
.f-base{position:absolute;inset:0;transform:translateZ(-13px);transform-style:preserve-3d}
.tray,.printed{position:absolute;inset:0;backface-visibility:hidden;border-radius:2px}
.tray{background:linear-gradient(135deg,#17110f,#2a1f1b);box-shadow:inset 0 0 0 3px #0c0807,inset 0 0 0 4px rgba(255,255,255,.07)}
.tray::before{content:"";position:absolute;inset:7% 7% 7% 7%;border-radius:2px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px)}
.printed{transform:rotateY(180deg);padding:calc(var(--cw)*.08);background:var(--c-bg);color:var(--c-ink);container-type:inline-size;display:flex;flex-direction:column;gap:2.2cqw}
.f-spine,.f-edge{position:absolute;top:0;width:26px;height:100%}
.f-spine{left:0;transform:translateX(-13px) rotateY(-90deg);background:var(--sb);color:var(--si);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.f-spine::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 25%,rgba(255,255,255,.14) 50%,transparent 70%,rgba(0,0,0,.4))}
.f-spine .sp-title{font-size:10.5px}
.f-edge{left:100%;transform:translateX(-13px) rotateY(90deg);background:linear-gradient(90deg,#1a1311,#3a2c27)}
/* disc */
.disc{
  position:absolute;right:calc(var(--cw)*.075);top:50%;width:calc(var(--cw)*.82);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;
  background:
    radial-gradient(circle,#0c0807 0 7%,rgba(255,255,255,.35) 7.4% 9%,transparent 9.4% 22%,rgba(255,255,255,.1) 22.4%,transparent 23%),
    conic-gradient(from 30deg,var(--mauve),var(--blue),var(--champagne),var(--blue),var(--mauve),var(--gold),var(--blue),var(--mauve));
  box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.25);transition:transform 1.2s var(--ease);
}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,rgba(255,255,255,.4),transparent 34%,transparent 62%,rgba(255,255,255,.22))}
.disc.spin{animation:spin 1.6s var(--ease)}
@keyframes spin{to{transform:translateY(-50%) rotate(720deg)}}
.disc-l{position:absolute;left:50%;top:15%;transform:translateX(-50%);font:700 calc(var(--cw)*.04)/1 var(--cond);letter-spacing:.17em;color:var(--espresso);text-transform:uppercase;text-align:center;z-index:2;width:60%}
/* booklet text */
.bk h4{font:700 calc(var(--cw)*.1)/1 var(--display);margin-bottom:calc(var(--cw)*.03)}
.bk .k{font:700 calc(var(--cw)*.036)/1 var(--cond);letter-spacing:.15em;text-transform:uppercase;color:var(--oxblood);margin-bottom:calc(var(--cw)*.04)}
.bk li{display:flex;gap:6px;justify-content:space-between;padding:calc(var(--cw)*.022) 0;border-bottom:1px dotted rgba(38,31,29,.4);font:600 calc(var(--cw)*.042)/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.bk li em{font-style:normal;color:var(--oxblood)}
.bk .hand{font-size:calc(var(--cw)*.06);margin-top:calc(var(--cw)*.05);color:var(--oxblood)}
/* printed back */
.pb-h{font:700 12cqw/1 var(--display)}
.pb-syn{font:500 5.4cqw/1.35 var(--sans);opacity:.92;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.pb-row{font:600 4.4cqw/1.2 var(--cond);letter-spacing:.11em;text-transform:uppercase;opacity:.9;display:flex;justify-content:space-between;gap:6px;border-top:1px solid currentColor;padding-top:2.4cqw}
.pb-w{font:700 4.6cqw/1.2 var(--cond);letter-spacing:.10em;text-transform:uppercase;color:var(--c-a)}
.pb-bar{margin-top:auto;height:12cqw;width:46cqw;background:repeating-linear-gradient(90deg,var(--c-ink) 0 .7cqw,transparent .7cqw 1.6cqw,var(--c-ink) 1.6cqw 3cqw,transparent 3cqw 3.6cqw);opacity:.85}
.pb-foot{font:600 3.6cqw/1 var(--cond);letter-spacing:.15em;text-transform:uppercase;opacity:.7}
.stage-ctl{display:flex;gap:10px;justify-content:center;margin:-8px 0 8px;flex-wrap:wrap;padding:0 16px}
.info{padding:6px 22px 60px}
.info h2{font-size:34px;margin:4px 0 8px}
.meta{color:var(--ink-soft);font-size:14px;margin-bottom:14px}
.sec{margin-top:26px}
.sec>.cap{display:block;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 26px;border-left:1px solid var(--champagne);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px var(--champagne)}
.tl li.re::before{background:var(--oxblood);box-shadow:0 0 0 2px var(--champagne)}
.tl .k{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:700 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.tl .k b{color:var(--link)} .tl li.re .k b{background:var(--oxblood);color:var(--cream);padding:3px 7px 2px;border-radius:2px}
.tl .note{margin-top:6px;color:var(--ink)}
.tl .small{font-size:13px;color:var(--ink-soft);margin-top:4px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.who i{width:9px;height:9px;border-radius:2px;background:var(--pc)}
.rate{font:700 14px var(--cond);letter-spacing:.06em;color:var(--link)}

/* ============================================================
   STARS
   ============================================================ */
.stars{display:inline-flex;gap:4px}
.star{position:relative;width:30px;height:30px;display:block}
.star::before{content:"";position:absolute;inset:0;
  clip-path:polygon(50% 2%,62% 36%,98% 37%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,2% 37%,38% 36%);
  background:var(--line)}
.star.full::before{background:var(--brass)}
.star.half::before{background:linear-gradient(90deg,var(--champagne) 50%,var(--line) 50%)}
.star button{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.star button:first-child{left:0}.star button:last-child{right:0}
.star button:focus-visible{outline-offset:-2px}
.rv{font:700 18px var(--cond);letter-spacing:.06em;margin-left:10px;align-self:center;min-width:3ch;color:var(--link)}
.stars-wrap{display:flex;align-items:center}

/* ============================================================
   TV (welcome + tonight)
   ============================================================ */
.tv{
  position:relative;display:grid;gap:14px;padding:18px;border-radius:26px 26px 14px 14px;
  background:var(--wood);background-size:900px 520px;
  box-shadow:0 40px 60px -20px rgba(0,0,0,.75),inset 0 0 0 1px rgba(228,198,163,.2),inset 0 3px 0 rgba(228,198,163,.3),inset 0 -6px 12px rgba(0,0,0,.5);
}
.tv-screen{
  position:relative;border-radius:18px/14px;overflow:hidden;min-height:340px;color:var(--cream);
  background:radial-gradient(ellipse at 50% 40%,#2b211d 0,#171110 70%,#0d0908 100%);
  box-shadow:inset 0 0 0 3px #060403,inset 0 0 70px rgba(0,0,0,.85),0 0 0 3px rgba(0,0,0,.5),0 0 40px rgba(228,198,163,.1);
}
.tv-screen::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),
  linear-gradient(115deg,rgba(255,255,255,.07),transparent 30%)}
.tv-in{position:relative;z-index:2;padding:22px;display:grid;gap:14px;align-content:start;text-shadow:0 0 12px rgba(228,198,163,.35)}
.tv-side{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:0 6px}
.knob{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,var(--champagne),var(--copper),var(--gold),var(--copper),var(--champagne));box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 0 0 5px rgba(0,0,0,.18);position:relative}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:10px;background:var(--espresso);transform:translateX(-50%) rotate(var(--k,20deg));transform-origin:50% 13px}
.vent{flex:1;height:14px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.55) 0 3px,transparent 3px 9px);border-radius:2px;opacity:.7}
.tv-label{font:600 10px var(--cond);letter-spacing:.20em;text-transform:uppercase;color:var(--gold);opacity:.85}
.tv-field{display:grid;gap:6px}
.tv-field label{font:600 11px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--champagne)}
.tv-field input{background:rgba(245,230,210,.07);border:0;border-bottom:1px solid var(--champagne);padding:10px 4px;color:var(--cream);font-size:16px;outline:none;border-radius:0}
.tv-field input:focus{background:rgba(245,230,210,.14)}
.tv-title{font:700 clamp(30px,5vw,46px)/1 var(--display)}
.tv .btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.5)}
.tv .btn.ghost{color:var(--cream);box-shadow:inset 0 0 0 1px var(--champagne)}
.static{position:absolute;inset:0;z-index:4;background:var(--grain);background-size:140px;opacity:.9;animation:jit .12s steps(3) infinite;mix-blend-mode:screen}
@keyframes jit{0%{background-position:0 0}33%{background-position:-40px 20px}66%{background-position:30px -50px}100%{background-position:10px 40px}}
.console{margin:0 14px;height:22px;background:var(--wood);background-size:900px 520px;box-shadow:0 12px 16px rgba(0,0,0,.5);border-radius:0 0 6px 6px}
.room{position:relative;overflow:hidden;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:24px;padding:36px 16px 60px}
.room .tv-wrap{max-width:940px;width:100%;margin:0 auto;position:relative;z-index:2}
.room h1{font-size:clamp(38px,7vw,76px);max-width:14ch;margin:0 auto 6px;max-width:940px;width:100%;text-wrap:balance}
.room .wm{font:600 12px var(--cond);letter-spacing:.23em;text-transform:uppercase;color:var(--champagne);max-width:940px;margin:0 auto;width:100%}
.room .intro{max-width:940px;margin:0 auto;width:100%}
.room .intro p{max-width:46ch;color:var(--ink-soft);margin-top:10px}
.lamp{position:absolute;pointer-events:none;display:none}
.lamp svg{width:100%;height:100%;overflow:visible}
@media(min-width:1100px){.lamp{display:block}}
.lampglow{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 38%,transparent),transparent 65%);display:none}
@media(min-width:1100px){.lampglow{display:block}}
.console-row{min-width:0;display:flex;align-items:flex-end;gap:1px;padding:0 14px;margin:0 14px;height:calc(120px*var(--unit));overflow:hidden;background:linear-gradient(180deg,rgba(8,4,2,.7),rgba(8,4,2,.45)),var(--wood);background-size:auto,900px 520px;box-shadow:inset 0 10px 20px rgba(0,0,0,.7)}
.console-row .spine{pointer-events:none}
.finep{font-size:13px;color:var(--ink-soft)}
.tv-in .finep{color:var(--champagne)}
.step{display:flex;gap:8px;margin-bottom:2px}.step i{width:22px;height:3px;background:rgba(245,230,210,.25)}.step i.on{background:var(--champagne)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:3px;background:var(--sc);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 2px 3px rgba(0,0,0,.5);position:relative}
.sw[aria-pressed="true"]::after{content:"";position:absolute;inset:-5px;border:2px solid var(--champagne);border-radius:5px}

/* ============================================================
   TOGETHER hero: a living room with one big lamp, and a shelf you can play with
   ============================================================ */
.pit{position:relative;margin:6px -16px 10px;padding:0 14px 34px;min-height:370px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .7s}
@media(min-width:768px){.pit{margin-left:0;margin-right:0;border:1px solid var(--line);border-radius:4px;min-height:470px}}
.pit.dim{background:linear-gradient(180deg,#171110,#0a0605)}
.pit-row{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,6vw,84px);width:100%;max-width:880px}
.floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--wood);background-size:900px 520px;
  box-shadow:inset 0 3px 0 rgba(228,198,163,.28),inset 0 12px 16px rgba(0,0,0,.5)}
.sofa{position:relative;flex:1 1 0;min-width:176px;max-width:430px;height:150px;z-index:2}
.biglamp{position:absolute;left:-26%;bottom:0;width:134%;aspect-ratio:460/330;z-index:0}
.biglamp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lampbtn{position:absolute;left:41%;top:9%;width:27%;height:17%;border-radius:50% 50% 6px 6px;z-index:6;cursor:pointer}
.lampbtn:hover{background:rgba(228,198,163,.12)}
.biglamp .cone,.biglamp .bulb{transition:opacity .6s}

const byDateDesc=(a,b)=>b.d.localeCompare(a.d);
const rew=c=>c.w.filter(x=>x.k==='re').length;
const lastW=c=>c.w.slice().sort(byDateDesc)[0];
const lastR=c=>{const x=c.w.filter(w=>w.r).sort(byDateDesc)[0];return x?x.r:null};
const nm=k=>PEOPLE[k]?PEOPLE[k].n:k;
const pcol=k=>V(PEOPLE[k]?PEOPLE[k].c:'--champagne');
const caseById=id=>S.cases.find(c=>c.id===id);
const titleById=id=>caseById(id)||EXTRAS.find(e=>e.id===id);
const rtText=c=>c.type==='tv'?`${c.eps} eps · ${c.min} min`:`${c.min} min`;
const heading=c=>c.type==='tv'?`${c.t} · Season ${c.s}`:c.t;
const allTitles=()=>[...S.cases,...EXTRAS.filter(e=>!caseById(e.id))];
const withNames=w=>w.who.length?w.who.map(nm).join(' & '):'Just you';
const initial=t=>(t.replace(/^(the|a|an)\s+/i,'')[0]||'U').toUpperCase();
function topSnack(list){const m={};list.forEach(w=>w.sn.forEach(s=>m[s]=(m[s]||0)+1));const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:null}
function allWatches(){return S.cases.flatMap(c=>c.w.map((w,i)=>({c,w,i})))}
function minutesOf(c,w){return c.type==='tv'?c.eps*c.min:c.min}
const lastDate=c=>c.w.length?lastW(c).d:'0000-00-00';
function getCase(id){
  const c=caseById(id); if(c)return c;
  const t=EXTRAS.find(e=>e.id===id); if(!t)return null;
  const p=placeholderCase(t); const o=S.tonight.some(x=>x.id===id), m=S.mine.includes(id);
  p.wrapped=o||m; p.list=o?'ours':m?'mine':null; return p;
}
function wantedItems(){
  const out=[], seen=new Set();
  S.tonight.forEach(t=>{const x=EXTRAS.find(e=>e.id===t.id); if(!x||caseById(t.id))return; const c=placeholderCase(x); c.wrapped=true; c.list='ours'; c.by=t.by; out.push(c); seen.add(t.id)});
  S.mine.forEach(id=>{if(seen.has(id))return; const x=EXTRAS.find(e=>e.id===id); if(!x||caseById(id))return; const c=placeholderCase(x); c.wrapped=true; c.list='mine'; out.push(c)});
  return out;
}
function placeholderCase(t){ // new case from catalogue title
  const h=hash(t.id);
  return {id:t.id,t:t.t,y:t.y,type:t.type,min:t.min,dir:t.dir,gen:t.gen,syn:t.syn,pal:h%PAL.length,tpl:1+(h>>3)%6,w:[],...(t.type==='tv'?{s:t.s,eps:t.eps}:{}),short:t.short};
}

function palVars(p){return `--c-bg:${V(p.bg)};--c-a:${V(p.a)};--c-b:${V(p.b)};--c-ink:${V(p.ink)}`}
function cover(c,opts={}){
  const p=PAL[c.pal%PAL.length], r=lastR(c), n=rew(c), L=c.t.length;
  const sz=L>24?'l':L>14?'m':'';
  const top=c.type==='tv'?`<span>Season ${SEASONS[c.s]||c.s}</span><span>${c.eps} eps</span>`:`<span>${c.gen[0]||'Film'}</span><span>${c.y}</span>`;
  return `<div class="cover cv${c.tpl}" style="${palVars(p)}">
    <div class="cv-art" data-i="${esc(initial(c.t))}"></div>
    <div class="cv-top">${top}</div>
    <div class="cv-title ${sz}">${esc(c.t)}</div>
    <div class="cv-meta">${c.type==='tv'?'The complete season':esc(c.dir.split(' ').slice(-1)[0])+' · '+c.min+' min'}</div>
    ${r?`<div class="cv-foil">${num(r)}</div>`:''}
    ${n?`<div class="cv-re">Rewatch ×${n}</div>`:''}
    <div class="cv-sheen"></div>
    ${c.wrapped?'<div class="cv-wrapfilm"></div><div class="cv-new">New</div>':''}
  </div>`;
}
function spine(c,opts={}){
  const h=hash(c.id), p=PAL[c.pal%PAL.length], tv=c.type==='tv';
  const tt=(c.short||c.t), extra=Math.min(24,Math.max(0,(tt.length-12)*3)), hh=(tv?160+(h%3)*8+Math.min(12,extra):148+(h%5)*6+extra), w=tv?38+(h%3)*3:24+(h%4)*2;
  const lean=0;
  const t=tt, fs=Math.max(7.5,Math.min(12,(hh-54)/(t.length*0.7)));
  const lw=lastW(c), who=(lw&&lw.who[0])||'you', r=lastR(c), n=rew(c);
  const dim=opts.dim?' dim':'', land=S.landed===c.id?' landing':'';
  const tab=c.wrapped?(c.list==='ours'?V('--champagne'):V(S.user.colour||'--copper')):pcol(who);
  return `<button class="spine ${tv?'season':''}${c.wrapped?' wrap':''}${dim}${land}" data-open="${c.id}" aria-label="${esc(heading(c))}, ${c.y}${c.wrapped?', still in the wrapper':''}${n?', rewatched '+n+' time'+(n>1?'s':''):''}"
   style="--w:${w};--h:${hh};--fs:${fs.toFixed(2)};--sb:${V(p.bg)};--sa:${V(p.cap)};--sc:${V(p.capink||'--espresso')};--si:${V(p.ink)};--lean:${lean}deg">
   <span class="sp-cap">${tv?'S'+c.s:String(c.y).slice(2)}</span>
   <span class="sp-title">${esc(t)}</span>
   <span class="sp-foot">${n?'<i class="sp-re"></i>':''}<i class="sp-r">${r?num(r):(c.wrapped?'New':'·')}</i></span>
   ${c.wrapped?'<i class="sp-wrap"></i>':''}<i class="sp-tab" style="background:${tab}"></i></button>`;
}
function caseHTML(c){
  const h=hash(c.id), p=PAL[c.pal%PAL.length], lw=lastW(c), sorted=c.w.slice().sort(byDateDesc);
  const t=(c.short||c.t);

function starsHTML(val){
  let s='';for(let i=1;i<=5;i++){const cls=val>=i?'full':val>=i-.5?'half':'';
    s+=`<span class="star ${cls}"><button type="button" data-r="${i-.5}" aria-label="${i-.5} stars"></button><button type="button" data-r="${i}" aria-label="${i} stars"></button></span>`}
  return `<div class="stars-wrap"><div class="stars" role="group" aria-label="Rating" data-val="${val||0}">${s}</div><span class="rv">${val?num(val):''}</span></div>`;
}

function fillBackwall(){

  const base=S.cases.slice().sort((a,b)=>hash(a.id)-hash(b.id));
  let h='',i=0;

function parseHash(){return (location.hash||'#home').slice(1).split('/')}
function go(screen){
  if(location.hash!=='#'+screen)location.hash='#'+screen; else route();
}
const ALIAS={tonight:'home',together:'home',us:'home'};
function route(){
  if(!S.authed){renderWelcome();return}
  let [scr,sub]=parseHash(); S.sub=sub||null;
  if(ALIAS[scr]){ if(scr==='together'&&sub==='shelf'){S.scope='ours';scr='shelf'}else scr=ALIAS[scr]; history.replaceState(null,'','#'+scr) }
  S.screen=['home','shelf','diary','me'].includes(scr)?scr:'home';
  if(!$('#view'))renderShell();
  refreshNav(); renderView();
  window.scrollTo({top:0});
}
function renderView(){
  const v=$('#view');
  v.classList.toggle('bleed',S.screen==='home');
  v.innerHTML=({home:viewHome,shelf:viewShelf,diary:viewDiary,me:viewMe})[S.screen]();
  if(S.screen==='home'||S.screen==='shelf')layoutShelves();
  S.landed=null; tickElapsed(); if(S.sheet)drawSheet();
}

const FILTERS=[['all','All'],['want','To watch'],['seen','Watched'],['re','Rewatches'],['movie','Films'],['tv','Shows']];
const lname=l=>S.unified?(l==='ours'?'Ours':'Mine'):(l==='ours'?'Our list':'My list');
function inScope(c){
  const sc=S.scope; if(sc==='all')return true;
  if(c.wrapped)return c.list===sc;
  return sc==='ours'?c.w.some(x=>x.who.includes(S.usual)):true;
}
function match(c){
  const f=S.filter;
  if(f==='all')return true; if(f==='want')return !!c.wrapped; if(f==='seen')return !c.wrapped;
  if(f==='movie')return c.type==='movie'; if(f==='tv')return c.type==='tv'; if(f==='re')return rew(c)>0;
  return true;
}
function sortCases(list){
  const a=list.slice();
  const k={recent:(x,y)=>((y.wrapped?1:0)-(x.wrapped?1:0))||lastDate(y).localeCompare(lastDate(x)),rating:(x,y)=>(lastR(y)||0)-(lastR(x)||0),title:(x,y)=>x.t.localeCompare(y.t),year:(x,y)=>y.y-x.y}[S.sort];
  return a.sort(k);
}
let SETS={};
function subline(items){
  const seen=items.filter(c=>!c.wrapped), want=items.length-seen.length, re=seen.reduce((n,c)=>n+rew(c),0), sn=topSnack(seen.flatMap(c=>c.w));
  return `${seen.length} watched${S.unified?`, ${want} still in the wrapper`:''}. ${re} rewatches. Most ordered: ${esc(sn||'nothing yet')}.`;
}
function shelfItems(){const seen=S.cases.filter(inScope), want=S.unified?wantedItems().filter(inScope):[]; return [...want,...seen]}
function highlightsHTML(){
  const k=S.usual, p=PEOPLE[k], shared=sharedWith(k);
  const ws=allWatches().filter(x=>x.w.who.includes(k));
  const first=ws.slice().sort((a,b)=>a.w.d.localeCompare(b.w.d))[0];
  const mostRe=shared.slice().sort((a,b)=>rew(b)-rew(a))[0];
  const dis=ws.filter(x=>x.w.r&&x.w.pr&&x.w.pr[k]!=null).map(x=>({...x,d:Math.abs(x.w.r-x.w.pr[k])})).sort((a,b)=>b.d-a.d)[0];
  const snack=topSnack(ws.map(x=>x.w));
  const long=shared.slice().sort((a,b)=>(b.type==='tv'?b.eps*b.min:b.min)-(a.type==='tv'?a.eps*a.min:a.min))[0];
  const stub=(kk,b,s)=>`<div class="stub"><div class="k">${kk}</div><b>${esc(b)}</b><span>${esc(s)}</span></div>`;
  const hrs=Math.round(ws.reduce((n,x)=>n+minutesOf(x.c,x.w),0)/60);
  return `<div class="us-head"><h2 class="display">You &amp; ${esc(p.n)}</h2><span class="cap">${shared.length} titles · ${hrs} hours · since ${fmt(p.since).replace(/^\d+ /,'')}</span></div>
    <p class="sub">The Usual · <b style="color:var(--ink)">${esc(p.ritual||'No ritual named yet')}</b> <button class="link" data-act="ritual" data-id="${k}">Rename</button></p>
    <div class="stubs">
      ${first?stub('First one',first.c.t,fmt(first.w.d)):''}
      ${mostRe&&rew(mostRe)?stub('Most rewatched',mostRe.t,`×${rew(mostRe)} rewatches`):''}
      ${dis&&dis.d>0?stub('Biggest disagreement',dis.c.t,`${num(dis.w.r)}★ vs ${num(dis.w.pr[k])}★`):''}
      ${snack?stub('Usual order',snack,'Most ordered between you'):''}
      ${long?stub('Longest sit',long.t,rtText(long)):''}
    </div>`;
}
function viewShelf(){
  if(!S.unified&&(S.filter==='want'||S.filter==='seen'))S.filter='all';
  const items=shelfItems();
  const films=sortCases(items.filter(c=>c.type==='movie')), shows=sortCases(items.filter(c=>c.type==='tv'));
  const recent=S.cases.filter(inScope).sort((a,b)=>lastDate(b).localeCompare(lastDate(a))).slice(0,10);
  SETS={films,shows,recent};
  const shown=items.filter(match).length;
  const title={all:'The shelf',ours:'Our shelf',mine:'My shelf'}[S.scope];
  const filters=FILTERS.filter(([k])=>S.unified||(k!=='want'&&k!=='seen')).filter(([k])=>k!=='movie'&&k!=='tv'||true);
  const body=S.view==='grid'
   ? `<div class="grid">${sortCases(items).map(c=>`<button class="gcase ${match(c)?'':'dim'}" data-open="${c.id}" aria-label="${esc(heading(c))}">${cover(c)}<b>${esc(c.t)}</b><i>${c.wrapped?'In the wrapper':(c.type==='tv'?'Season '+c.s:c.y)+(rew(c)?' · rewatch ×'+rew(c):'')}</i></button>`).join('')}</div>`
   : `<div class="cabwrap"><div class="cabinet">
        <div class="door door-l"><span class="plate">Shows</span><div class="shelfset" data-set="shows"></div><i class="hinge a"></i><i class="hinge b"></i></div>
        <div class="carcass"><div class="cornice"><span class="plate">Films · ${films.length}</span></div><i class="reel"></i><div class="shelfset" data-set="films"></div></div>
        <div class="door door-r"><span class="plate">Lately</span><div class="shelfset" data-set="recent"></div><i class="hinge a"></i><i class="hinge b"></i></div>
      </div></div>`;
  return `<section class="shelfpage">
    <div class="head"><div><h1 class="display">${title}</h1><p class="sub">${subline(items)}</p></div>
      <div class="tools"><div class="seg" role="group" aria-label="Whose shelf">${[['ours','Ours'],['mine','Mine'],['all','All']].map(([k,l])=>`<button data-scope="${k}" aria-pressed="${S.scope===k}">${l}</button>`).join('')}</div>
      <button class="btn small" data-act="addToList">${S.unified?'Add to the shelf':'Add to a list'}</button></div></div>
    <div class="chips filters" role="group" aria-label="Filter">${filters.map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}
      <span class="count" style="margin-left:auto"><span class="seg" role="group" aria-label="View"><button data-view="grid" aria-pressed="${S.view==='grid'}">Posters</button><button data-view="shelf" aria-pressed="${S.view==='shelf'}">Spines</button></span></span></div>
    ${body}
    ${!S.unified?`<h2 class="display sh-h">Lists</h2>${listsSection()}`:''}
    <p class="layoutnote">${shown} of ${items.length} shown. Layout: ${S.unified?'one shelf, with films you want in shrink-wrap.':'shelf + lists.'} <button class="link" data-layout="${S.unified?'split':'one'}">Switch to ${S.unified?'shelf + lists':'one shelf'}</button></p></section>`;
}
const PROPS=['<span class="prop p-vase"><i class="nk"></i><i class="bd"></i></span>','<span class="prop p-stack"><i></i><i></i><i></i></span>','<span class="prop p-lamp"><i class="sh"></i><i class="st"></i><i class="bs"></i></span>','<span class="prop p-frame"><i></i></span>'];
function fillShelf(el,list,opts={}){
  const unit=parseFloat(getComputedStyle(el).getPropertyValue('--unit'))||1;
  const avg=(opts.tv?42:28)*unit+1, width=el.clientWidth-26;
  const per=Math.min(opts.max||99,Math.max(3,Math.floor(width/avg)));
  if(opts.maxRows)list=list.slice(0,opts.maxRows*per);
  const minRows=opts.minRows||3, rows=Math.max(minRows,Math.ceil(list.length/per));
  let h='';
  for(let r=0;r<rows;r++){
    const chunk=list.slice(r*per,r*per+per);
    const prop=opts.props&&chunk.length<per?PROPS[(r+(opts.pofs||0))%PROPS.length]:'';
    h+=`<div class="row"><div class="row-items ${chunk.length?'':'bare'}">${chunk.map(c=>spine(c,{dim:!match(c)})).join('')}${prop}</div><div class="board"></div></div>`;
  }
  el.innerHTML=h;
}
function layoutShelves(){
  $$('.shelfset').forEach(el=>{
    const k=el.dataset.set;
    if(k==='bg'){fillBackwall();return}
    if(k==='mini'){fillMini();return}
    if(k==='shared'){fillShelf(el,SETS.shared||[],{minRows:4,max:el.clientWidth>700?99:13,props:true,pofs:0});return}
    if(k==='us'){fillShelf(el,SETS.us||[],{minRows:2});return}
    fillShelf(el,SETS[k]||[],{tv:k==='shows',minRows:k==='films'?4:3,max:k==='films'?(el.clientWidth>700?99:13):k==='shows'?4:5,props:k==='films',pofs:0});
  });
}
let lastW_=0;
const RO=new ResizeObserver(()=>{
  const v=$('#view'), w=v?Math.round(v.clientWidth):Math.round(innerWidth);
  if(Math.abs(w-lastW_)>6){lastW_=w;clearTimeout(layoutShelves.t);layoutShelves.t=setTimeout(()=>{if($('.shelfset'))layoutShelves()},60)}
});
RO.observe(document.documentElement);

  d.hidden=false; document.body.classList.add('dock-open');
  d.innerHTML=`<div class="dock-bar"><span></span><button class="btn ghost small" data-act="close" aria-label="Close case (Esc)">Close</button></div>

   <div class="stage-ctl"><button class="btn small" data-act="openCase">${S.caseOpen?'Close the case':'Open the case'}</button><button class="btn ghost small" data-act="flipCase">${S.flip?'Front':'Turn it over'}</button><button class="btn ghost small" data-act="spin">Spin the disc</button></div>
   <div class="info">
     <h2 class="display">${esc(c.t)}${c.type==='tv'?' <span style="color:var(--ink-soft)">S'+c.s+'</span>':''}</h2>
     <p class="meta">${c.y} · ${esc(c.dir)} · ${rtText(c)} · ${esc(c.gen.join(', '))}</p>

function poolFor(){

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true; else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0])rows.push(row);row=[]}
    else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function importCSV(text){
  const rows=parseCSV(text); if(rows.length<2){toast('That file looks empty');return}
  const h=rows[0].map(x=>x.trim().toLowerCase()), ix=n=>h.findIndex(x=>x===n);
  const iN=ix('name'),iY=ix('year'),iR=ix('rating'),iD=h.findIndex(x=>x==='watched date'||x==='date');
  if(iN<0){toast('Couldn’t find a Name column');return}
  let add=0,re=0;
  rows.slice(1).forEach(r=>{
    const t=(r[iN]||'').trim(); if(!t)return; const y=+r[iY]||2000, id=slug(t)+'-'+y;
    let c=caseById(id)||S.cases.find(x=>slug(x.t)===slug(t)&&x.type==='movie');
    const d=(iD>=0&&/^\d{4}-\d\d-\d\d$/.test(r[iD]))?r[iD]:TODAY, rt=iR>=0&&+r[iR]?+r[iR]:null;
    if(!c){const h2=hash(id);c={id,t,y,type:'movie',min:100,dir:'Unknown',gen:['Film'],syn:'Imported from Letterboxd.',pal:h2%PAL.length,tpl:1+(h2>>3)%6,w:[]};S.cases.push(c);add++}
    const k=c.w.length?'re':'first'; if(k==='re')re++;
    c.w.push(W(k,d,[],rt,'',[],'Couch',[]));
  });
  saveState();toast(`Imported ${add} films, ${re} rewatches`);renderView();
}

    if(choice==='fix'){Object.assign(c.w.slice().sort((a,b)=>a.d.localeCompare(b.d))[0],{d:date,r:r||c.w[0].r,n:note||c.w[0].n,who:w.who,sn:w.sn,at:w.at,m:w.m})}
    else{w.k='re';c.w.push(w)}
  }else c.w.push(w);
  S.tonight=S.tonight.filter(x=>x.id!==c.id); S.mine=S.mine.filter(x=>x!==c.id); if(S.draft===c.id)S.draft=null; if(S.session&&S.session.id===c.id)S.session=null;
  const linked=w.who.find(k=>LINKED.includes(k));
  if(linked&&choice!=='fix'){S.pending.push({caseId:c.id,wi:c.w.length-1,who:linked,theirs:[3.5,4,4.5,5][hash(c.id+date)%4],mine:null,done:false});if(r){/* rated already; keep secret flow only if no rating */ const p=S.pending[S.pending.length-1];p.mine=r}}
  S.landed=c.id; saveState(); closeLayer(); refreshNav();
  const rewatch=w.k==='re'&&choice!=='fix';
  toast(rewatch?`Rewatch ×${rew(c)}. On the shelf.`:isNew?'On the shelf.':'Updated.');
  if(S.screen==='me')go('shelf');else renderView();
  if(linked&&!(r&&false))setTimeout(()=>toast(`${nm(linked)} has been asked for a Sealed Take`),3000);
}
function closeLayer(){const had=S.sheet;S.sheet=null;const l=$('#layer');if(l)l.innerHTML='';if(had&&S.authed&&$('#view'))renderView()}

/* ============================================================
   SEARCH
   ============================================================ */
let SMODE='open';
function openSearch(mode='open'){
  SMODE=mode; S.sheetBack=(mode==='add'&&S.sheet)?S.sheet:null; S.sheet=null;
  const ph=mode==='add'?'Add to '+lname(S.tab)+'…':mode==='play'?'What are you watching?':'Search films and shows…';
  $('#layer').innerHTML=`<div class="scrim top" id="scrim"><div class="searchbox" role="dialog" aria-modal="true" aria-label="Search"><input id="sq" placeholder="${ph}" autocomplete="off">
    ${mode==='add'?`<div class="addbar"><span>Add to</span><div class="seg addseg" role="group" aria-label="Which list">${['ours','mine'].map(k=>`<button type="button" data-tab="${k}" aria-pressed="${S.tab===k}">${lname(k)}</button>`).join('')}</div></div>`:''}
    <div class="results" id="sres"></div></div></div>`;
  searchResults(''); setTimeout(()=>{const e=$('#sq');if(e)e.focus()},40);
}
function searchResults(q){
  q=q.trim().toLowerCase(); const el=$('#sres'); let h='';
  const hit=c=>!q||c.t.toLowerCase().includes(q)||(c.dir||'').toLowerCase().includes(q);
  const shelf=S.cases.filter(hit), wanted=wantedItems().filter(hit);
  const listed=new Set([...S.tonight.map(t=>t.id),...S.mine]);
  const else_=EXTRAS.filter(e=>!caseById(e.id)&&!listed.has(e.id)&&hit(e));
  const row=(c,tag,attr)=>`<button class="res" ${attr}><span>${cover(c.w?c:placeholderCase(c))}</span><span><b>${esc(heading(c))}</b><br><small>${c.y} · ${esc(c.dir)}</small></span><em>${tag}</em></button>`;
  const grp=t=>`<div class="group cap">${t}</div>`;
  if(SMODE==='play'){
    if(wanted.length)h+=grp('Up next')+wanted.slice(0,6).map(c=>row(c,'Start',`data-play="${c.id}"`)).join('');
    if(shelf.length)h+=grp('Watch again')+shelf.slice(0,q?6:3).map(c=>row(c,'Start',`data-play="${c.id}"`)).join('');
    if(else_.length)h+=grp('Something new')+else_.slice(0,6).map(c=>row(c,'Start',`data-play="${c.id}"`)).join('');
  }else if(SMODE==='add'){
    if(else_.length)h+=grp('Suggestions')+else_.slice(0,8).map(c=>row(c,'Add',`data-addt="${c.id}"`)).join('');
  }else{
    if(wanted.length)h+=grp('In the wrapper')+wanted.slice(0,5).map(c=>row(c,lname(c.list),`data-open="${c.id}"`)).join('');
    if(shelf.length)h+=grp(q?'On your shelf':'Recently watched')+shelf.sort((a,b)=>lastDate(b).localeCompare(lastDate(a))).slice(0,q?8:4).map(c=>row(c,rew(c)?'Rewatched':'',`data-open="${c.id}"`)).join('');
    if(else_.length)h+=grp('Elsewhere')+else_.slice(0,6).map(c=>row(c,'View',`data-open="${c.id}"`)).join('');
  }
  el.innerHTML=h||'<p class="empty">Nothing yet. In the real app this searches all of TMDB.</p>';
}
const shared=k=>sharedWith(k).length;

/* ============================================================
   EVENTS
   ============================================================ */
function applyTheme(){
  const t=S.theme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.theme;
  document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name=theme-color]'); if(m)m.content=t==='dark'?'#261F1D':'#F5E6D2';
  document.documentElement.classList.toggle('rm',S.rm);
}
document.addEventListener('click',e=>{
  if(S.dragEnd&&performance.now()-S.dragEnd<350&&e.target.closest&&e.target.closest('.minicab')){return}
  const t=e.target.closest('[data-w],[data-tab],[data-play],[data-layout],[data-scope],[data-mode2],[data-modeset],[data-sw],[data-go],[data-open],[data-act],[data-view],[data-filter],[data-us],[data-lw],[data-lwhen],[data-lat],[data-lm],[data-rmsn],[data-pickt],[data-mode],[data-mood],[data-mins],[data-theme-set],[data-colour],[data-addt],[data-logt],.stars button');
  if(!t){ if(e.target.id==='scrim'){closeLayer()} return }
  const d=t.dataset;
  if(d.w){let n=d.w;
    if(n==='done'){if(wtmp.name){S.user={name:wtmp.name,handle:wtmp.handle,colour:wtmp.colour||'--copper',mode:wtmp.mode||'couple'};saveState()}welcomeEnter();return}
    wstep=n;renderWelcome();return}
  if(d.mode2){wtmp.mode=d.mode2;$$('.mopt').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(d.modeset){S.user.mode=d.modeset;saveState();renderView();return}
  if(d.sw&&!t.closest('#view')){wtmp.colour=d.sw;$$('.sw').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(d.go){e.preventDefault();if(d.go!=='me'||S.screen!=='me'){location.hash='#'+d.go}return}
  if(t.matches('.stars button')){const st=t.closest('.stars');setStars(st,+t.dataset.r);return}
  if(d.open){const sc=$('#scrim');if(sc)closeLayer();S.open=null;openCase(d.open);return}
  if(d.view){S.view=d.view;saveState();renderView();return}
  if(d.filter){S.filter=d.filter;renderView();return}
  if(d.us&&!d.act){S.us=d.us;if(d.closes||d.closeS){closeLayer();if(S.screen!=='together'){location.hash='#together';S.us=d.us;return}}renderView();return}
  if(d.lw){ if(d.lw==='solo')LG.who=[]; else{LG.who=LG.who.includes(d.lw)?LG.who.filter(x=>x!==d.lw):[...LG.who,d.lw]} paintLog();return}
  if(d.lwhen){LG.when=d.lwhen;paintLog();return}
  if(d.lat){LG.at=d.lat;paintLog();return}
  if(d.lm){LG.m=LG.m.includes(d.lm)?LG.m.filter(x=>x!==d.lm):(LG.m.length<3?[...LG.m,d.lm]:LG.m);paintLog();return}
  if(d.rmsn!==undefined){LG.sn.splice(+d.rmsn,1);paintLog();return}
  if(d.pickt){pickTitle(d.pickt);return}
  if(d.mode){S.pickMode=d.mode;S.pick=null;S.pickNone=null;renderView();return}
  if(d.mood){S.mood=S.mood===d.mood?null:d.mood;renderView();return}
  if(d.mins){S.mins=d.mins;renderView();return}
  if(d.themeSet){S.theme=d.themeSet;saveState();applyTheme();renderView();return}
  if(d.colour){S.user.colour=d.colour;saveState();renderView();return}
  if(d.addt){closeLayer();addTo(d.addt,S.tab);return}
  if(d.tab){S.tab=d.tab;if($('#scrim')){$$('.addseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===S.tab));const q=$('#sq');if(q&&SMODE==='add')q.placeholder='Add to '+lname(S.tab)+'\u2026'}else renderView();return}
  if(d.play){closeLayer();startSession(d.play);return}
  if(d.layout){S.unified=d.layout==='one';saveState();renderView();toast(S.unified?'One shelf.':'Shelf + lists.');return}
  if(d.scope){S.scope=d.scope;renderView();return}
  if(d.logt){closeLayer();openLog(d.logt);return}
  if(d.sw&&t.closest('#view')){
    if(d.sw==='rm'){S.rm=!S.rm;applyTheme();saveState();renderView()} else {t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true')}
    return}
  switch(d.act){
    case 'log':openLog(d.id);break;
    case 'search':openSearch();break;
    case 'close':closeCase();break;
    case 'closeLayer':closeLayer();break;
    case 'openCase':case 'flipCase':dockCtl(d.act);break;
    case 'spin':{const x=$('#disc');if(x){if(!S.caseOpen)dockCtl('openCase');x.classList.remove('spin');void x.offsetWidth;x.classList.add('spin')}break}
    case 'addOurs':addTo(d.id,'ours');break;
    case 'saveMine':addTo(d.id,'mine');break;
    case 'clearDraft':S.draft=null;saveState();refreshNav();renderView();break;
    case 'removeFrom':if(d.list==='mine')S.mine=S.mine.filter(x=>x!==d.id);else S.tonight=S.tonight.filter(x=>x.id!==d.id);saveState();if(d.close)closeCase();renderView();break;
    case 'addToList':openSearch('add');break;
    case 'lamp':lampClick();break;
    case 'openDecide':S.sheet='decide';drawSheet();break;
    case 'openSeal':S.sheet='seal';drawSheet();break;
    case 'cancelSession':S.session=null;S.draft=null;saveState();refreshNav();renderView();toast('Back to deciding.');break;
    case 'openOurShelf':S.scope='ours';go('shelf');break;
    case 'say':{const b=t.closest('.seatp');$$('.bubble').forEach(x=>x.remove());const el=document.createElement('span');el.className='bubble';el.textContent=SAYS[(sayI++)%SAYS.length];b.appendChild(el);setTimeout(()=>el.remove(),2600);break}
    case 'miniShuffle':{const ids=(SETS.mini||[]).map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}S.order=ids;saveState();fillMini();const m=$('#minicab');if(m){m.classList.add('shuf');setTimeout(()=>m.classList.remove('shuf'),1200)}break}
    case 'miniPull':{const list=SETS.mini||[];if(!list.length)break;const c=list[Math.floor(Math.random()*list.length)];$$('.minicab .spine.pulled').forEach(x=>x.classList.remove('pulled'));const sp=$('.minicab .spine[data-open="'+c.id+'"]');if(sp)sp.classList.add('pulled');toast('How about '+heading(c)+'?');break}
    case 'toggleHowto':{S.howtoOpen=!S.howtoOpen;saveState();const sec=$('.howto');if(sec){sec.classList.toggle('open',S.howtoOpen);const b=$('.howto-b',sec);if(b)b.hidden=!S.howtoOpen;t.setAttribute('aria-expanded',S.howtoOpen)}break}
    case 'ritual':{const v=prompt('Name your Usual (for example, Friday nights)',PEOPLE[d.id].ritual||'');if(v!==null){PEOPLE[d.id].ritual=v.trim();saveState();renderView()}break}
    case 'makeUsual':S.usual=d.id;saveState();toast(nm(d.id)+' is now Your Usual');renderView();break;
    case 'invite':{const link=location.origin+location.pathname+'#invite-'+slug(S.user.handle);(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Invite link copied'),()=>toast('Invite link: '+link));break}
    case 'addGuest':{const i=$('#lg-guest'),n=i.value.trim();if(!n)break;const k='g_'+slug(n);PEOPLE[k]={n,c:'--champagne',guest:true};LG.who=[...LG.who.filter(x=>x),k];i.value='';saveState();paintLog();break}
    case 'reveal':reveal(t.closest('.envelope'));break;
    case 'pick':case 'pickAgain':doPick();break;
    case 'veto':if(!S.vetoes.you&&S.pick){S.vetoes.you=true;S.vetoed=[...(S.vetoed||[]),S.pick.id];toast('Vetoed. Spinning again.');doPick();}break;
    case 'resetRound':S.vetoes={you:false};S.vetoed=[];S.pick=null;S.pickNone=null;toast('Fresh round, fresh vetoes');renderView();break;
    case 'startTonight':{closeLayer();S.draft=d.id;S.session=null;saveState();refreshNav();if(S.open)closeCase();toast('Tonight\u2019s pick is set. Click the lamp when you are ready.');if(S.screen==='home')renderView();else go('home');break}
    case 'epUp':{const p=titleById(S.progress.id);S.progress.ep=Math.min(p.eps,S.progress.ep+1);saveState();renderView();break}
    case 'epDown':S.progress.ep=Math.max(0,S.progress.ep-1);saveState();renderView();break;
    case 'export':{const b=new Blob([JSON.stringify({cases:S.cases,tonight:S.tonight},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='the-usual-export.json';a.click();toast('Exported');break}
    case 'signout':S.authed=false;saveState();wstep='in';location.hash='#home';renderWelcome();break;
  }
});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('howto'))S.howtoOpen=e.target.open},true);
document.addEventListener('input',e=>{
  if(e.target.id==='lg-t')logResults(e.target.value);
  if(e.target.id==='sq')searchResults(e.target.value);
  if(e.target.id==='lg-d')LG.date=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-sort]')){S.sort=e.target.value;renderView()}
  if(e.target.id==='csv'&&e.target.files[0]){const f=e.target.files[0];f.text().then(importCSV)}
});
document.addEventListener('keydown',e=>{
  const typing=/input|textarea|select/i.test(document.activeElement.tagName);
  if(e.key==='Enter'&&document.activeElement.id==='lg-s'){e.preventDefault();const v=e.target.value.trim();if(v&&!LG.sn.includes(v)){LG.sn.push(v);e.target.value='';paintLog();$('#lg-s').focus()}return}
  if(e.key==='Enter'&&document.activeElement.id==='lg-t'){e.preventDefault();const b=$('#lg-res .res');if(b)pickTitle(b.dataset.pickt);return}
  if(e.key==='Enter'&&document.activeElement.id==='sq'){const b=$('#sres .res');if(b)b.click();return}
  if(e.key==='Escape'){ if($('#layer').innerHTML){closeLayer();return} if(S.open){closeCase();return} }
  if(typing||e.metaKey||e.ctrlKey||e.altKey||!S.authed)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openLog()}
  else if(e.key==='/'){e.preventDefault();openSearch()}
  else if(S.screen==='shelf'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const sp=$$('.spine'),i=sp.indexOf(document.activeElement);
    if(i>-1){e.preventDefault();(sp[i+(e.key==='ArrowRight'?1:-1)]||sp[i]).focus()} else if(sp[0]){sp[0].focus()}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='f-in'){S.user.name=S.user.name||'Zai';welcomeEnter()}
  else if(id==='f-forgot'){toast('If that email exists, a reset link is on its way');wstep='in';renderWelcome()}
  else if(id==='f-j1'){wtmp.name=$('#dn').value.trim();wtmp.handle=$('#hd').value.trim();wstep='join2';renderWelcome()}
  else if(id==='logform'){saveLog()}
});

matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme()});
window.addEventListener('hashchange',()=>{closeCase();route()});

/* ============================================================
   BOOT
   ============================================================ */
loadState(); applyTheme();
if(!location.hash)history.replaceState(null,'','#home');
setInterval(tickElapsed,20000);
route();
</script>
