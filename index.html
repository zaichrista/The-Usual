<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Usual</title>
<meta name="description" content="A private library of the films and series you keep, shelved by hand.">
<meta name="theme-color" content="#F9F0E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..600,100&family=DM+Sans:wght@400..700&display=swap" rel="stylesheet">
<script>
/* set the theme before first paint */
try{var t=localStorage.getItem('the-usual-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
/* ============================================================
   THE USUAL — v1 (editorial)
   Palette is the owner's nine colours; everything else is a mix of them.
   ============================================================ */
:root{
  --espresso:#261F1D; --cream:#F5E6D2; --champagne:#D8B596; --copper:#B77D55; --walnut:#78462F;
  --oxblood:#63352F; --gold:#E4C6A3; --mauve:#806C82; --blue:#9CAFCB;
  --serif:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'DM Sans','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --wood:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='900' height='520'%3E%3Cfilter id='f' x='0' y='0' width='100%25' height='100%25'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.0032 0.2' numOctaves='5' seed='8'/%3E%3CfeColorMatrix values='0.55 0 0 0 0.17 0.34 0 0 0 0.085 0.22 0 0 0 0.045 0 0 0 0 1'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
}
:root[data-theme="light"]{
  --bg:color-mix(in srgb,var(--cream) 52%,#fff);
  --bg2:color-mix(in srgb,var(--cream) 90%,var(--champagne));
  --ink:var(--espresso);
  --soft:color-mix(in srgb,var(--espresso) 60%,var(--bg));
  --rule:color-mix(in srgb,var(--espresso) 20%,transparent);
  --accent:var(--oxblood); --accent-ink:var(--cream);
  --star:var(--oxblood); --star-off:color-mix(in srgb,var(--espresso) 18%,transparent);
  --case-shadow:0 46px 60px -34px rgba(38,31,29,.6);
}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--espresso) 88%,#000);
  --bg2:var(--espresso);
  --ink:var(--cream);
  --soft:color-mix(in srgb,var(--cream) 58%,var(--bg));
  --rule:color-mix(in srgb,var(--cream) 20%,transparent);
  --accent:var(--champagne); --accent-ink:var(--espresso);
  --star:var(--gold); --star-off:color-mix(in srgb,var(--cream) 20%,transparent);
  --case-shadow:0 46px 60px -30px rgba(0,0,0,.85);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
.serif,h1,h2,.wordmark,.sp-t,.cv-title,.quote q,.pn-title{font-variation-settings:'SOFT' 100,'WONK' 0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:inherit}
ul,ol{list-style:none}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:200}
.skip:focus{left:8px}
.wrap{max-width:1260px;margin:0 auto;padding:0 clamp(16px,3vw,44px)}

.kicker{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.serif{font-family:var(--serif)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.85em 1.35em;border-radius:2px;
  font:600 13px/1 var(--sans);letter-spacing:.05em;background:var(--ink);color:var(--bg);transition:transform .15s var(--ease),opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn[disabled]{opacity:.35;pointer-events:none}
.tlink{font:600 12px/1 var(--sans);letter-spacing:.06em;text-decoration:underline;text-underline-offset:4px;color:var(--soft)}
.tlink:hover{color:var(--ink)}
.tlink.danger:hover{color:#a3402f}

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--ink);background:var(--bg);position:relative;z-index:20}
.mast-main{display:flex;align-items:center;gap:16px 30px;padding:16px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:6px 16px;margin-right:auto;flex-wrap:wrap}
#libname{font:italic 300 17px/1 var(--serif);color:var(--soft)}
#libname:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.themeswitch{position:relative;display:flex;align-items:center;justify-content:space-between;width:54px;height:28px;padding:0 8px;border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--rule);color:var(--soft);transition:box-shadow .2s}
.themeswitch:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.themeswitch svg{position:relative;z-index:2;transition:color .3s}
.themeswitch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .45s var(--ease)}
.themeswitch .ic-sun{color:var(--bg)}
:root[data-theme="dark"] .themeswitch .knob{transform:translateX(26px)}
:root[data-theme="dark"] .themeswitch .ic-sun{color:var(--soft)}
:root[data-theme="dark"] .themeswitch .ic-moon{color:var(--bg)}
.wordmark{font:300 clamp(34px,4.6vw,50px)/.9 var(--serif);letter-spacing:-.03em;text-decoration:none;margin-right:auto}
.wordmark em{font-style:italic}
.mainnav{display:flex;gap:26px;align-items:center}
.mainnav a,.mainnav button{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--soft);padding:8px 0;border-bottom:1.5px solid transparent}
.mainnav a:hover,.mainnav button:hover{color:var(--ink)}
.mainnav [aria-current="page"]{color:var(--ink);border-color:var(--ink)}
@media (max-width:640px){
  #libname{display:none}
  .mast-main{padding:12px 0 10px}
  .mainnav{order:3;width:100%;gap:22px;border-top:1px solid var(--rule);padding-top:8px}
}

/* ---------- shelf page ---------- */
#view{outline:none;transition:margin-right .35s var(--ease)}
.deck{padding:clamp(22px,3.4vw,40px) 0 clamp(14px,2vw,22px);display:grid;gap:10px}
.deck h1{font:300 clamp(28px,4vw,46px)/1.08 var(--serif);letter-spacing:-.025em;max-width:22ch;text-wrap:balance}
.deck h1 em{font-style:italic;color:var(--soft)}
.deck p{color:var(--soft);font-size:14px}

.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 34px;padding:12px 0 18px;border-top:1px solid var(--rule)}
.tabs{display:flex;gap:6px 24px;flex-wrap:wrap;margin-right:auto}
.tabs button{font:600 13px/1 var(--sans);letter-spacing:.04em;padding:8px 0;color:var(--soft);border-bottom:1.5px solid transparent}
.tabs button sup{font-size:10px;margin-left:3px;opacity:.7}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.ctl select,.ctl input{appearance:none;-webkit-appearance:none;background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:3px 18px 4px 0;font:italic 300 18px/1.25 var(--serif);min-width:150px;border-radius:0}
.ctl input{width:min(300px,78vw)}
.ctl select{background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23888' stroke-width='1.3'/%3E%3C/svg%3E") right 2px center no-repeat}
.ctl input::placeholder{color:var(--soft);opacity:.8}
.ctl select:focus-visible,.ctl input:focus-visible{outline-offset:2px}
.ctl option{font:16px var(--sans);color:#261F1D}

/* ---------- stage: editorial column + bookcase ---------- */
.stage{display:block}
.rail{position:relative}
@media (min-width:1100px){
  .stage{display:grid;grid-template-columns:clamp(330px,29vw,420px) minmax(0,1fr);gap:clamp(28px,3.4vw,56px);align-items:start;padding-top:clamp(22px,3vw,38px)}
  .rail{position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow-y:auto;overflow-x:hidden;padding:2px 6px 24px 2px;margin:-2px -6px 0 -2px;scrollbar-width:thin}
  .rail .deck{padding-top:0}
  .rail .deck h1{font-size:clamp(30px,2.7vw,40px);max-width:none}
  .rail .controls{flex-direction:column;align-items:stretch;gap:18px;padding-top:14px}
  .rail .controls .tabs{margin-right:0}
  .rail .ctl input,.rail .ctl select{width:100%}
  body.v-shelf.panel-open .rail-main{display:none}
  body.v-shelf .scrim.for-panel{display:none}
  .stage .panel{position:static;width:auto;border:0;box-shadow:none;animation:none;overflow:visible;background:none;z-index:auto}
  .stage .pn-bar{position:sticky;top:0;padding:0 0 12px;background:var(--bg);border-bottom:1px solid var(--ink)}
  .stage .pn-body{padding:20px 0 32px;gap:20px}
  .stage .pn-title{font-size:clamp(32px,2.8vw,40px)}
  .stage .pn-cover{width:min(210px,60%)}
  .stage .ledger li{grid-template-columns:1fr}
  .stage .ledger .lg-x{grid-column:1}
}

/* ---------- the bookcase ---------- */
.bookcase{--u:1;--sh:190;position:relative;margin:4px 0 0;border-radius:3px 3px 0 0;
  background:var(--wood);background-size:100% 520px;
  padding:0 calc(22px*var(--u));box-shadow:var(--case-shadow),inset 0 0 0 1px rgba(228,198,163,.16)}
.crown{height:calc(30px*var(--u));margin:0 calc(-22px*var(--u));background:var(--wood);background-size:100% 520px;
  border-radius:3px 3px 0 0;position:relative;box-shadow:0 6px 12px rgba(0,0,0,.4)}
.crown::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(228,198,163,.3),transparent 38%,rgba(0,0,0,.22))}
.plinth{height:calc(34px*var(--u));margin:0 calc(-22px*var(--u));background:var(--wood);background-size:100% 520px;position:relative;box-shadow:inset 0 3px 0 rgba(0,0,0,.35)}
.plinth::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 40%,rgba(0,0,0,.3))}
.cavity{position:relative;min-height:200px;
  background:
    repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.018) 118px 120px),
    linear-gradient(180deg,#0d0807,#1a110e);
  box-shadow:inset 0 16px 28px rgba(0,0,0,.75),inset 12px 0 18px -8px rgba(0,0,0,.75),inset -12px 0 18px -8px rgba(0,0,0,.75)}
.row{position:relative}
.slots{display:flex;align-items:flex-end;gap:calc(2px*var(--u));padding:0 calc(16px*var(--u));
  height:calc((var(--sh) + 40)*var(--u)*1px)}
.board{height:calc(17px*var(--u));background:var(--wood);background-size:100% 520px;position:relative;
  box-shadow:0 12px 14px -2px rgba(0,0,0,.55),inset 0 -4px 6px rgba(0,0,0,.4)}
.board::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:rgba(228,198,163,.5)}
.tag{position:absolute;left:calc(16px*var(--u));top:calc(12px*var(--u));font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,230,210,.55);pointer-events:none}
.tag i{font:italic 400 15px/1 var(--serif);letter-spacing:0;text-transform:none;margin-left:8px;color:rgba(245,230,210,.4)}
.row.bare .slots{opacity:1}
.hollow{position:absolute;inset:0 0 auto 0;height:calc((var(--sh) + 40)*var(--u)*1px);display:grid;place-items:center;text-align:center;padding:0 24px;pointer-events:none;z-index:2}
.hollow>div{pointer-events:auto;max-width:34ch;color:var(--cream)}
.hollow h2{font:italic 300 clamp(26px,3vw,36px)/1.1 var(--serif);margin-bottom:10px}
.hollow p{font-size:14px;color:rgba(245,230,210,.7);margin-bottom:18px}
.hollow .btn{background:var(--cream);color:var(--espresso)}

/* ---------- spines: one height, always ---------- */
.sp{position:relative;flex:none;display:block;width:calc(var(--w)*var(--u)*1px);height:calc(var(--sh)*var(--u)*1px);
  transform-origin:50% 100%;transition:transform .38s var(--ease),opacity .3s,filter .3s;z-index:1}
.sp:hover,.sp:focus-visible,.sp.pulled{transform:translateY(calc(-17px*var(--u)));z-index:6}
.sp:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sp-body{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  background:var(--sb);color:var(--si);border-radius:2px 2px 0 0;
  box-shadow:inset 1px 0 0 rgba(255,255,255,.2),inset -1px 0 0 rgba(0,0,0,.4),2px 0 5px rgba(0,0,0,.55)}
.sp-body::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(0,0,0,.34),rgba(0,0,0,0) 22%,rgba(255,255,255,.15) 48%,rgba(0,0,0,0) 66%,rgba(0,0,0,.4))}
.sp-cap{width:100%;flex:none;height:calc(8px*var(--u));background:var(--sa);display:grid;place-items:center;
  font:700 calc(9px*var(--u))/1 var(--sans);letter-spacing:.04em;color:var(--sb)}
.sp.series .sp-cap{height:calc(21px*var(--u))}
.sp-t{flex:1;min-height:0;max-height:100%;writing-mode:vertical-rl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:400 calc(var(--fs)*var(--u)*1px)/1 var(--serif);letter-spacing:0;padding:calc(9px*var(--u)) 0 calc(6px*var(--u))}
.sp-foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:calc(4px*var(--u));padding-bottom:calc(9px*var(--u))}
.sp-y{display:flex;flex-direction:column;align-items:center;font:600 calc(8.5px*var(--u))/1.05 var(--sans);letter-spacing:.02em;opacity:.85}
.sp-dot{width:calc(6px*var(--u));height:calc(6px*var(--u));border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.sp-pip{position:absolute;top:calc(2px*var(--u));right:calc(2px*var(--u));width:calc(5px*var(--u));height:calc(5px*var(--u));border-radius:50%;background:var(--gold);z-index:3;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.sp.wrapped .sp-body{filter:saturate(.72) brightness(.97);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),2px 0 5px rgba(0,0,0,.55)}
.sp.wrapped .sp-body::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:linear-gradient(115deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.04) 26%,rgba(255,255,255,.2) 52%,rgba(255,255,255,0) 72%)}
.sp.dim{opacity:.2;filter:grayscale(1)}
.sp.dim:hover{opacity:.9;filter:none}
.sp.static{display:inline-block;pointer-events:none;transform:none}
.sp-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);opacity:0;pointer-events:none;
  background:var(--cream);color:var(--espresso);padding:7px 11px 8px;border-radius:2px;white-space:nowrap;
  box-shadow:0 8px 18px rgba(0,0,0,.5);transition:opacity .15s,transform .2s var(--ease);display:grid;gap:2px;text-align:left}
.sp-tip b{font:400 15px/1.15 var(--serif)}
.sp-tip i{font:600 10px/1 var(--sans);font-style:normal;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.sp:hover .sp-tip,.sp:focus-visible .sp-tip{opacity:1;transform:translate(-50%,0)}
.sp.tl .sp-tip{left:0;transform:translate(0,4px)}.sp.tl:hover .sp-tip,.sp.tl:focus-visible .sp-tip{transform:none}
.sp.tr .sp-tip{left:auto;right:0;transform:translate(0,4px)}.sp.tr:hover .sp-tip,.sp.tr:focus-visible .sp-tip{transform:none}
.sp.landing{animation:land 1s var(--ease) both}
@keyframes land{0%{transform:translateY(-120px) rotate(-5deg);opacity:0}50%{opacity:1}78%{transform:translateY(5px)}100%{transform:none}}

/* stars */
.stars{display:inline-block;font:400 15px/1 var(--sans);letter-spacing:2px;--p:0%;
  background:linear-gradient(90deg,var(--star) var(--p),var(--star-off) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;vertical-align:-1px}

/* ---------- under the shelf ---------- */
.below{display:grid;gap:clamp(30px,4vw,54px);padding:clamp(34px,5vw,64px) 0 70px}
.figures{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.fig{padding:18px 0 16px;border-right:1px solid var(--rule);padding-left:18px}
.fig:first-child{padding-left:0}.fig:last-child{border-right:0}
.fig b{display:block;font:300 clamp(38px,4.6vw,60px)/1 var(--serif);letter-spacing:-.04em}
.fig span{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.margins h2{font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:22px}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,4vw,56px)}
.quote{display:grid;gap:14px;align-content:start;text-align:left}
.quote q{font:italic 300 clamp(20px,2.1vw,26px)/1.22 var(--serif);quotes:"“" "”";text-wrap:pretty}
.quote cite{font:600 11px/1.4 var(--sans);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.quote:hover q{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.foot{padding:20px 0 40px;border-top:1px solid var(--rule);font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media (max-width:760px){
  .figures{grid-template-columns:1fr 1fr}
  .fig:nth-child(2){border-right:0}
  .fig:nth-child(3){padding-left:0;border-top:1px solid var(--rule)}.fig:nth-child(4){border-top:1px solid var(--rule)}
  .quotes{grid-template-columns:1fr}
}

/* ---------- index ---------- */
.idx{width:100%;border-collapse:collapse}
.idx th{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);text-align:left;padding:0 12px 12px 0;border-bottom:1px solid var(--ink)}
.idx th button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:6px}
.idx th button:hover,.idx th[aria-sort] button{color:var(--ink)}
.idx td{padding:12px 12px 12px 0;border-bottom:1px solid var(--rule);vertical-align:baseline;font-size:14px}
.idx tbody tr{cursor:pointer}
.idx tbody tr:hover td{background:var(--bg2)}
.idx td.t{font:300 clamp(20px,2.1vw,27px)/1.12 var(--serif);letter-spacing:-.015em;padding-left:6px}
.idx td.t small{display:block;font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:5px}
.idx td.n{font-variant-numeric:tabular-nums}
.idx tr.dim{opacity:.25}
.idx tr:focus-visible{outline-offset:-2px}
@media (max-width:760px){.idx .hide-s{display:none}}

/* ---------- covers ---------- */
.cover{container-type:inline-size;position:relative;aspect-ratio:135/190;overflow:hidden;background:var(--cb);color:var(--ci);border-radius:2px 3px 3px 2px}
.cv-art{position:absolute;inset:0;pointer-events:none}
.cv-sheen{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.4) 0,rgba(255,255,255,.16) 2.2%,rgba(0,0,0,.12) 4.2%,transparent 7%),linear-gradient(112deg,rgba(255,255,255,.22) 0,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 64%,rgba(255,255,255,.08))}
.cv-top{position:absolute;left:9cqw;right:7cqw;top:6.5cqw;padding-bottom:3.2cqw;border-bottom:.5cqw solid currentColor;display:flex;justify-content:space-between;
  font:600 4.3cqw/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.cv-title{position:absolute;left:9cqw;right:7cqw;bottom:17cqw;font:300 13cqw/.96 var(--serif);letter-spacing:-.025em;text-wrap:balance}
.cv-title.m{font-size:10.2cqw}.cv-title.l{font-size:8cqw}
.cv-by{position:absolute;left:9cqw;right:7cqw;bottom:7cqw;font:600 3.8cqw/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- the case: open it, turn it over ---------- */

.back{position:absolute;inset:0;background:var(--sb);color:var(--si);padding:9% 8%;display:flex;flex-direction:column;gap:5%;

/* ============================================================
   TMDB — film and series data, posters
   Put a key in TMDB_BAKED to ship one key to everyone who opens the site.
   Leave it empty and each person pastes their own in Settings (kept in their browser).
   Accepts a v3 API key or a v4 read access token.
   ============================================================ */
const TMDB_BAKED='';
const TMDB={
  base:'https://api.themoviedb.org/3', img:'https://image.tmdb.org/t/p/',
  key(){return (TMDB_BAKED||tryLS.get('the-usual-tmdb')||'').trim()},
  on(){return !!this.key()},
  async get(path,params={}){
    const k=this.key(), u=new URL(this.base+path), h={Accept:'application/json'};
    Object.entries(params).forEach(([a,b])=>u.searchParams.set(a,b));
    if(k.length>40)h.Authorization='Bearer '+k; else u.searchParams.set('api_key',k);
    const r=await fetch(u,{headers:h});
    if(r.status===401)throw new Error('key');
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  },
  poster(p,size='w500'){return p?this.img+size+p:''}
};
function tmdbToItem(r){
  const tv=r.media_type==='tv', date=tv?r.first_air_date:r.release_date;
  return {id:`tmdb-${tv?'tv':'movie'}-${r.id}`,tmdb:`${tv?'tv':'movie'}-${r.id}`,t:(tv?r.name:r.title)||'Untitled',y:date?+date.slice(0,4):0,
    type:tv?'series':'film',s:tv?1:undefined,min:0,dir:'',gen:[],syn:r.overview||'',poster:TMDB.poster(r.poster_path),watches:[]};
}
async function tmdbSearch(q){
  const d=await TMDB.get('/search/multi',{query:q,include_adult:'false',language:'en-GB'});
  return d.results.filter(r=>(r.media_type==='movie'||r.media_type==='tv')).slice(0,8).map(tmdbToItem);
}
async function tmdbDetails(it){
  const tid=it.tmdb.split('-')[1];
  if(it.type==='film'){
    const d=await TMDB.get(`/movie/${tid}`,{append_to_response:'credits',language:'en-GB'});
    const dirs=((d.credits&&d.credits.crew)||[]).filter(c=>c.job==='Director').map(c=>c.name).slice(0,2);
    return {...it,min:d.runtime||0,gen:(d.genres||[]).map(g=>g.name),dir:dirs.join(' & '),syn:d.overview||it.syn,poster:TMDB.poster(d.poster_path)||it.poster,
      y:d.release_date?+d.release_date.slice(0,4):it.y};
  }
  const d=await TMDB.get(`/tv/${tid}`,{language:'en-GB'});
  const seasons=(d.seasons||[]).filter(x=>x.season_number>0).map(x=>({n:x.season_number,eps:x.episode_count||0,poster:TMDB.poster(x.poster_path),y:x.air_date?+x.air_date.slice(0,4):0}));
  const first=seasons[0]||{n:1,eps:0,poster:'',y:it.y};
  const showPoster=TMDB.poster(d.poster_path)||it.poster;
  return {...it,seasons:seasons.length?seasons:[first],s:first.n,eps:first.eps,showPoster,poster:first.poster||showPoster,y:first.y||it.y,
    min:(d.last_episode_to_air&&d.last_episode_to_air.runtime)||(d.episode_run_time&&d.episode_run_time[0])||0,
    gen:(d.genres||[]).map(g=>g.name),dir:(d.created_by||[]).map(c=>c.name).slice(0,2).join(' & '),syn:d.overview||it.syn};
}

const KEY='the-usual-v4';
const S={
  items:[],
  people:{tim:{n:'Tim',c:'--blue'},jess:{n:'Jess',c:'--mauve'},mum:{n:'Mum',c:'--champagne'}},
  lib:{a:'Zai',b:'Tim'},partner:'tim',

  cs:{ry:-24,rx:5,open:false},open:null,add:null,landed:null,order:[],cat:null
};
function save(){
  tryLS.set(KEY,JSON.stringify({items:S.items,people:S.people,lib:S.lib,partner:S.partner,filter:S.filter,sort:S.sort,isort:S.isort}));
  queueCloudSave();
}
function load(){
  const raw=tryLS.get(KEY);
  if(!raw){S.items=seedItems();return}
  try{
    const d=JSON.parse(raw);
    S.items=Array.isArray(d.items)?d.items.map(norm):seedItems();
    if(d.people)S.people={...S.people,...d.people};
    if(d.lib)S.lib={...S.lib,...d.lib};
    if(d.partner)S.partner=d.partner;
    if(d.filter)S.filter=d.filter;
    if(d.sort)S.sort=d.sort;
    if(d.isort)S.isort=d.isort;
  }catch(e){S.items=seedItems()}
}

/* ============================================================
   DERIVED
   ============================================================ */
const byId=id=>S.items.find(i=>i.id===id);
const wsorted=it=>it.watches.slice().sort((a,b)=>a.d.localeCompare(b.d));
const lastW=it=>{const w=wsorted(it);return w[w.length-1]};
const lastDate=it=>{const w=lastW(it);return w?w.d:''};
const latestR=it=>{const w=wsorted(it).filter(x=>x.r);return w.length?w[w.length-1].r:null};
const rewatches=it=>Math.max(0,it.watches.length-1);
const nm=k=>S.people[k]?S.people[k].n:k;
const withText=w=>w.who.length?'With '+w.who.map(nm).join(' & '):'Just you';
const heading=it=>it.type==='series'?`${it.t}, season ${it.s}`:it.t;
const kindText=it=>it.type==='series'?`Series · Season ${it.s}`:'Film';
const minsOf=it=>it.type==='series'?(it.eps||1)*(it.min||0):(it.min||0);
const pcol=k=>`var(${S.people[k]?S.people[k].c:'--champagne'})`;
const matches=(it,q)=>{
  if(!q)return true; q=q.toLowerCase();
  const hay=[it.t,it.short,it.dir,it.y,it.note,(it.gen||[]).join(' '),...it.watches.flatMap(w=>[w.note,w.ate,...w.who.map(nm)])].join(' ').toLowerCase();
  return q.split(/\s+/).every(p=>hay.includes(p));
};
const SORTS={
  added:{n:'The order I added them',f:null},
  title:{n:'Title, A to Z',f:(a,b)=>sortKey(a.t).localeCompare(sortKey(b.t))},
  year:{n:'Year released',f:(a,b)=>(a.y||0)-(b.y||0)||sortKey(a.t).localeCompare(sortKey(b.t))},
  watched:{n:'Last watched',f:(a,b)=>lastDate(b).localeCompare(lastDate(a))},
  colour:{n:'Colour of the spine',f:(a,b)=>a.col-b.col||sortKey(a.t).localeCompare(sortKey(b.t))}
};
const passFilter=it=>S.filter==='all'||(S.filter==='film'&&it.type==='film')||(S.filter==='series'&&it.type==='series')||(S.filter==='waiting'&&it.status==='waiting');
function arranged(){
  const list=S.items.filter(passFilter);
  const f=SORTS[S.sort]&&SORTS[S.sort].f;
  const seen=list.filter(i=>i.status==='seen'), wait=list.filter(i=>i.status==='waiting');
  if(f){seen.sort(f);wait.sort(f)}
  return {seen,wait};
}
function counts(){
  return {all:S.items.length,film:S.items.filter(i=>i.type==='film').length,series:S.items.filter(i=>i.type==='series').length,waiting:S.items.filter(i=>i.status==='waiting').length};
}

const starsHTML=r=>`<span class="stars" style="--p:${(r||0)/5*100}%" role="img" aria-label="${r?r+' out of 5':'Not rated'}">★★★★★</span>`;
const rtxt=r=>r?(r%1?r:r+'.0'):'';

function coverHTML(it){
  const p=SP[it.col%SP.length], t=hash(it.id)%5, n=it.t.length;
  if(it.poster)return `<div class="cover cvp" style="--cb:var(${p.bg});--ci:var(${p.ink});--ca:var(${p.band})"><img src="${esc(it.poster)}" alt="Poster for ${esc(heading(it))}" loading="lazy" onerror="this.remove()"><div class="cv-sheen"></div></div>`;
  const sz=n<=13?'':n<=24?'m':'l';
  return `<div class="cover cv${t}" style="--cb:var(${p.bg});--ci:var(${p.ink});--ca:var(${p.band})"><div class="cv-art"></div>
    <div class="cv-top"><span>${it.type==='series'?'Series · S'+it.s:'Film'}</span><span>${it.y||''}</span></div>
    <div class="cv-title ${sz}">${esc(it.t)}</div><div class="cv-by">${esc(it.status==='waiting'?'':(it.dir||''))}</div><div class="cv-sheen"></div></div>`;
}
function baseWidth(it){ // film cases are slim, season sets are thicker. Height never changes.
  const j=hash(it.id)%3*2;
  return it.type==='series'?34+j:26+j;
}
function spineHTML(it,o={}){
  const p=SP[it.col%SP.length];
  const label=it.short||it.t;
  const fs=Math.max(9.5,Math.min(16,Math.floor(132/(label.length*.55))));
  const y=String(it.y||'');
  const first=it.watches.length?wsorted(it)[0].who[0]:null;
  const r=latestR(it);
  const aria=`${heading(it)}, ${it.y||''}. ${it.status==='waiting'?'Still wrapped. Its details unlock once you have watched it.':'On the shelf.'}${r?' Rated '+r+'.':''}`;
  const tag=o.static?'span':'button';
  const drag=o.drag&&!o.static?'draggable="true"':'';
  const tip=`<span class="sp-tip"><b>${esc(heading(it))}</b><i>${it.y||''} · ${it.status==='waiting'?'Waiting':(r?'★ '+rtxt(r):'On the shelf')}</i></span>`;
  return `<${tag} ${o.static?'':`type="button" ${drag} data-id="${esc(it.id)}" tabindex="-1" aria-label="${esc(aria)}"`}
    class="sp ${it.type==='series'?'series':''} ${it.status==='waiting'?'wrapped':''} ${o.cls||''}"
    style="--w:${baseWidth(it)};--fs:${fs};--sb:var(${p.bg});--si:var(${p.ink});--sa:var(${p.band})">
    <span class="sp-body">${rewatches(it)?'<span class="sp-pip" title="Watched more than once"></span>':''}
    <span class="sp-cap">${it.type==='series'?'S'+it.s:''}</span><span class="sp-t">${esc(label)}</span>
    <span class="sp-foot">${y.length===4?`<span class="sp-y"><span>${y.slice(0,2)}</span><span>${y.slice(2)}</span></span>`:''}${first?`<span class="sp-dot" style="background:${pcol(first)}"></span>`:''}</span></span>
    ${o.static?'':tip}</${tag}>`;
}

  $('#libname').textContent=`the library of ${S.lib.a}${S.lib.b?' & '+S.lib.b:''}`;
  const tb=$('#btn-theme');tb.setAttribute('aria-checked',String(S.theme==='dark'));tb.setAttribute('aria-label',S.theme==='dark'?'Evening light. Switch to daylight':'Daylight. Switch to evening');
  $$('[data-nav]').forEach(a=>{if(a.dataset.nav===S.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
function applyTheme(){
  document.documentElement.dataset.theme=S.theme;
  tryLS.set('the-usual-theme',S.theme);
  const m=$('meta[name=theme-color]');if(m)m.content=S.theme==='dark'?'#1d1816':'#F9F0E5';
  paintMast();
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}

/* ============================================================
   ROUTING
   ============================================================ */
function route(){
  const h=(location.hash||'#/').replace(/^#\/?/,'');
  S.view=h.startsWith('index')?'index':'shelf';
  document.title=S.view==='index'?'The Index — The Usual':'The Usual';
  document.body.classList.toggle('v-shelf',S.view==='shelf');
  paintMast();
  if(S.view==='index')viewIndex();else viewShelf();
}

/* ============================================================
   SHELF VIEW
   ============================================================ */
function controlsHTML(){
  const c=counts();
  const tabs=[['all','All'],['film','Films'],['series','Series'],['waiting','Waiting']];
  return `<div class="controls">
    <div class="tabs" role="group" aria-label="Show">${tabs.map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${S.filter===k}">${l}<sup>${c[k]}</sup></button>`).join('')}</div>
    ${S.view==='shelf'?`<div class="ctl"><label class="sr" for="sort">Arranged by</label><select id="sort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${S.sort===k?'selected':''}>${v.n}</option>`).join('')}</select></div>`:''}
    <div class="ctl"><label class="sr" for="find">Find</label><input id="find" type="search" autocomplete="off" placeholder="a title, a name, a line you wrote" value="${esc(S.q)}"></div>
  </div>`;
}
function deckText(){
  const seen=S.items.filter(i=>i.status==='seen').length, wait=S.items.filter(i=>i.status==='waiting').length;
  const hl=(f,t)=>`<button type="button" class="hl" data-filter="${f}" title="${f==='all'?'Show everything':'Show only what is waiting'}">${t}</button>`;
  if(!S.items.length)return `An empty shelf, <em>for now.</em>`;
  if(!seen)return hl('waiting',`${cap(words(wait))} ${wait===1?'title':'titles'}, <em>all still in the wrapper.</em>`);
  return `${hl('all',`${cap(words(seen))} ${seen===1?'title':'titles'}`)} on the shelf${wait?`, <em>${hl('waiting',`and ${words(wait)} still in the wrapper.`)}</em>`:'.'}`;
}
function sinceText(){
  if(!S.items.length)return 'Nothing kept yet.';
  const first=S.items.map(i=>i.added).sort()[0];
  return `Kept by ${esc(S.lib.a)}${S.lib.b?' &amp; '+esc(S.lib.b):''} since ${fmtMonth(first)}.`;
}
function viewShelf(){
  $('#view').innerHTML=`<div class="wrap">
    <div class="stage">
      <div class="rail">
        <div class="rail-main">
          <section class="deck"><h1 id="deck-h">${deckText()}</h1><p>${sinceText()}</p></section>
          ${controlsHTML()}
          <button type="button" class="tlink pull" data-act="pull">Pull one out at random</button>
        </div>
        <aside class="panel" id="panel" hidden tabindex="-1" aria-label="Title details"></aside>
      </div>
      <div class="shelfcol"><div class="bookcase" id="case" style="--u:1"><div class="crown"></div><div class="cavity" id="cavity"></div><div class="plinth"></div></div></div>
    </div>
    <div class="below" id="below"></div>
  </div>`;
  fillShelf();
  fillBelow();
  observe();
  if(S.open&&byId(S.open))renderPanel();else{S.open=null;document.body.classList.remove('panel-open');$('#scrim').hidden=true}
}
let ro=null, lastBreaks='';
function observe(){
  if(ro)ro.disconnect();
  const cav=$('#cavity'); if(!cav||!window.ResizeObserver)return;
  let raf=0;
  ro=new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{ if(S.view==='shelf'){ const p=pack(); if(p.sig!==lastBreaks)fillShelf(true) } })});
  ro.observe(cav);
}
const unitFor=w=>w>=1000?1.2:w>=820?1.08:w>=620?.98:w>=460?.86:.76;
function pack(){
  const cav=$('#cavity'); const W=cav?cav.clientWidth:900;
  const u=unitFor(W), padX=16*u, usable=W-2*padX, gap=2*u;
  const {seen,wait}=arranged();
  const groups=[];
  if(seen.length)groups.push({key:'seen',label:'On the shelf',items:seen});
  if(wait.length)groups.push({key:'wait',label:'Waiting in the wrapper',items:wait});
  const rows=[];
  groups.forEach(g=>{
    let row=null, used=0;
    g.items.forEach(it=>{
      const w=baseWidth(it)*u;
      if(!row||used+w>usable){row={label:null,items:[]};rows.push(row);used=0;if(g.items[0]===it)row.label=g}
      row.items.push(it);used+=w+gap;
    });
  });
  const minRows=4;
  const sig=u+'|'+rows.map(r=>(r.label?'#'+r.label.key:'')+r.items.map(i=>i.id).join(',')).join('/');
  return {rows,groups,u,sig,minRows};
}
const canDrag=()=>S.sort==='added'&&S.filter==='all'&&!S.q.trim();
function fillShelf(keepScroll){
  const cav=$('#cavity'); if(!cav)return;
  const p=pack(); lastBreaks=p.sig;
  $('#case').style.setProperty('--u',p.u);
  const empty=!p.rows.length;
  let html='';
  p.rows.forEach(r=>{
    const n=r.items.length;
    html+=`<div class="row"><div class="slots" role="group" aria-label="${r.label?esc(r.label.label):'Shelf'}">
      ${r.label&&r.label.key==='wait'?`<span class="tag">${esc(r.label.label)}<i>${r.label.items.length}</i></span>`:''}
      ${r.items.map((it,i)=>spineHTML(it,{drag:canDrag(),cls:`${i<3?'tl':''} ${i>=n-3?'tr':''} ${S.open===it.id?'pulled':''} ${S.landed===it.id?'landing':''}`})).join('')}
    </div><div class="board"></div></div>`;
  });
  for(let i=p.rows.length;i<p.minRows;i++){
    html+=`<div class="row bare"><div class="slots"></div><div class="board"></div></div>`;
  }
  if(empty){
    const none=S.items.length>0;
    html+=`<div class="hollow"><div>${none?`<h2>Nothing on this shelf.</h2><p>Try another filter, or add something new.</p>`:`<h2>Nothing here yet.</h2><p>Start with the first one you ever loved. Everything else follows.</p>`}<button class="btn" type="button" data-act="add">Add the first one</button></div></div>`;
  }
  cav.innerHTML=html;
  S.order=p.rows.flatMap(r=>r.items.map(i=>i.id));
  const first=$('.sp',cav); const pulled=$('.sp.pulled',cav);
  (pulled||first)&&(pulled||first).setAttribute('tabindex','0');
  applyFind();
  if(S.landed){
    const el=$(`.sp[data-id="${CSS.escape(S.landed)}"]`,cav);
    if(el)el.scrollIntoView({block:'center',behavior:reduceMotion()?'auto':'smooth'});
    const id=S.landed; S.landed=null;
    setTimeout(()=>{const e=$(`.sp[data-id="${CSS.escape(id)}"]`);if(e)e.classList.remove('landing')},1200);
  }
}
function applyFind(){
  const q=S.q.trim();
  $$('#cavity .sp').forEach(el=>{const it=byId(el.dataset.id);el.classList.toggle('dim',!!q&&!!it&&!matches(it,q))});
  $$('.idx tbody tr').forEach(tr=>{const it=byId(tr.dataset.id);tr.classList.toggle('dim',!!q&&!!it&&!matches(it,q))});
}
function fillBelow(){
  const el=$('#below'); if(!el)return;
  const seen=S.items.filter(i=>i.status==='seen');
  const all=seen.flatMap(i=>i.watches.map(w=>({i,w})));
  const mins=seen.reduce((a,i)=>a+i.watches.length*minsOf(i),0);
  const re=seen.reduce((a,i)=>a+rewatches(i),0);
  const notes=all.filter(x=>x.w.note).sort((a,b)=>b.w.d.localeCompare(a.w.d));
  const pick=[];const used=new Set();
  for(const n of notes){if(!used.has(n.i.id)){used.add(n.i.id);pick.push(n);if(pick.length===3)break}}
  el.innerHTML=(S.items.length?`
    <div class="figures">
      <div class="fig"><b>${seen.length}</b><span>On the shelf</span></div>
      <div class="fig"><b>${all.length}</b><span>Evenings</span></div>
      <div class="fig"><b>${Math.round(mins/60)}</b><span>Hours together</span></div>
      <div class="fig"><b>${re}</b><span>Returns</span></div>
    </div>`:'')+
    (pick.length?`<section class="margins" aria-label="Lines you wrote"><div class="quotes">
      ${pick.map(({i,w})=>`<button type="button" class="quote" data-id="${esc(i.id)}"><q>${esc(w.note)}</q><cite>${esc(heading(i))} · ${w.who.length?'with '+esc(w.who.map(nm).join(' & '))+' · ':''}${fmtMonth(w.d)}</cite></button>`).join('')}
    </div></section>`:'')+
    `<div class="foot"><span>The Usual is kept in this browser. Nothing leaves your device.</span><span>Film and series data and images from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</span></div>`;
}
function refreshHeader(){
  const h=$('#deck-h'); if(h)h.innerHTML=deckText();
  const tabs=$('.tabs'); if(tabs){const c=counts();$$('button',tabs).forEach(b=>{b.setAttribute('aria-pressed',String(S.filter===b.dataset.filter));$('sup',b).textContent=c[b.dataset.filter]})}
}

/* ============================================================
   INDEX VIEW
   ============================================================ */
function viewIndex(){
  const cols=[['title','Title'],['year','Year'],['format','Format'],['last','Last watched'],['with','With'],['rating','Rating']];
  $('#view').innerHTML=`<div class="wrap">
    <section class="deck"><h1>Everything we keep, <em>in plain type.</em></h1></section>
    ${controlsHTML()}
    <table class="idx"><thead><tr>${cols.map(([k,l])=>`<th scope="col" class="${['format','with'].includes(k)?'hide-s':''}" ${S.isort.k===k?`aria-sort="${S.isort.d>0?'ascending':'descending'}"`:''}><button type="button" data-isort="${k}">${l}${S.isort.k===k?(S.isort.d>0?' ↑':' ↓'):''}</button></th>`).join('')}</tr></thead><tbody id="idx-body"></tbody></table>
    <div class="below" id="below"></div>
    <aside class="panel" id="panel" hidden tabindex="-1" aria-label="Title details"></aside></div>`;
  fillIndex();
  if(S.open&&byId(S.open))renderPanel();else{S.open=null;document.body.classList.remove('panel-open');$('#scrim').hidden=true}
  const b=$('#below');if(b)b.innerHTML=`<div class="foot"><span>Click any title to open its page.</span><span>${S.items.length} kept</span></div>`;
}
function fillIndex(){
  const key={title:i=>sortKey(i.t),year:i=>i.y||0,format:i=>i.type+(i.s||''),last:i=>lastDate(i),with:i=>{const w=lastW(i);return w?w.who.map(nm).join(' '):''},rating:i=>latestR(i)||0};
  const k=key[S.isort.k]||key.title;
  const list=S.items.filter(passFilter).sort((a,b)=>{const x=k(a),y=k(b);return (x<y?-1:x>y?1:0)*S.isort.d||sortKey(a.t).localeCompare(sortKey(b.t))});
  S.order=list.map(i=>i.id);
  $('#idx-body').innerHTML=list.map(i=>{const w=lastW(i),r=latestR(i);return `<tr data-id="${esc(i.id)}" tabindex="0" class="${S.open===i.id?'open':''}">
    <td class="t">${esc(i.t)}<small>${i.status==='waiting'?'Waiting in the wrapper':esc(i.dir||'')}</small></td>
    <td class="n">${i.y||''}</td><td class="hide-s">${i.type==='series'?'Series · S'+i.s:'Film'}</td>
    <td class="n">${w?fmt(w.d):'—'}</td><td class="hide-s">${w?(w.who.length?esc(w.who.map(nm).join(' & ')):'Just you'):'—'}</td>
    <td>${r?starsHTML(r):'—'}</td></tr>`}).join('')||`<tr><td colspan="6" style="padding:30px 0;cursor:default"><span class="serif" style="font-size:26px;font-style:italic">Nothing here yet.</span></td></tr>`;
  applyFind();
}

/* ============================================================
   THE CASE — open it, turn it over
   ============================================================ */
function sealedCaseHTML(it){
  const p=SP[it.col%SP.length];
  return `<div class="case-wrap"><div class="case-stage locked" role="img" aria-label="The case for ${esc(heading(it))}, still in its shrink-wrap">
    <div class="case3d" style="--sb:var(${p.bg});--si:var(${p.ink});--sa:var(${p.band});--ry:-24deg;--rx:5deg">
      <div class="c-base"><div class="in"></div><div class="out"></div></div>
      <div class="c-spine"><span>${esc(it.short||it.t)}</span></div><div class="c-edge-r"></div><div class="c-top"></div><div class="c-bot"></div>
      <div class="c-front"><div class="f-out">${coverHTML(it)}<i class="gloss"></i><i class="wrapfx"></i></div><div class="f-in"></div></div>
    </div></div>
    <div class="case-ctl"><span class="sealed">Sealed until you’ve watched it</span></div></div>`;
}
function caseHTML(it){
  if(it.status==='waiting')return sealedCaseHTML(it);
  const c=S.cs, p=SP[it.col%SP.length], ws=wsorted(it), noted=ws.filter(w=>w.note), lw=noted[noted.length-1]||null;
  const waiting=it.status==='waiting', label=it.short||it.t;
  const sty=`--sb:var(${p.bg});--si:var(${p.ink});--sa:var(${p.band});--ry:${c.ry}deg;--rx:${c.rx}deg`;
  const n=ws.length;
  return `<div class="case-wrap">
  <div class="case-stage" tabindex="0" role="group" aria-label="The case for ${esc(heading(it))}. Drag, or use the arrow keys, to turn it. Press Enter to open or close it.">
    <div class="case3d ${c.open?'open':''}" style="${sty}">
      <div class="c-base">
        <div class="in"><div class="tray"><button type="button" class="disc" data-act="spin" aria-label="Spin the disc"><i>${it.y||''}</i></button>
          <p class="tray-n">${waiting?'still in the wrapper':n===1?'one evening':(words(n)+' evenings')}</p></div></div>
        <div class="out"><div class="back"><p class="b-t">${esc(it.t)}</p>${it.syn?`<p class="b-s">${esc(it.syn)}</p>`:''}
          <p class="b-m">${[it.dir,it.min?it.min+' min':'',(it.gen||[]).slice(0,2).join(' / ')].filter(Boolean).map(esc).join(' · ')}</p><div class="b-bar"></div></div></div>
      </div>
      <div class="c-spine"><span>${esc(label)}</span></div><div class="c-edge-r"></div><div class="c-top"></div><div class="c-bot"></div>
      <div class="c-front"><div class="f-out">${coverHTML(it)}<i class="gloss"></i></div>
        <div class="f-in"><div class="insert"><p class="in-h">${esc(it.t)}</p>
          ${lw?`<p class="in-q">“${esc(lw.note)}”</p><p class="in-m">${esc(withText(lw))} · ${fmt(lw.d)}</p>`:`<p class="in-q">${waiting?(it.note?esc(it.note):'Saved for a good night.'):'Nothing written down yet.'}</p>`}</div></div></div>
    </div>
  </div>
  <div class="case-ctl"><button type="button" class="tlink" data-act="case-open">${c.open?'Close the case':'Open the case'}</button><button type="button" class="tlink" data-act="case-flip">Turn it over</button></div></div>`;
}
function applyCase(){
  const c=$('.case3d');if(!c)return;
  c.style.setProperty('--ry',S.cs.ry+'deg');c.style.setProperty('--rx',S.cs.rx+'deg');
  c.classList.toggle('open',S.cs.open);
  const b=$('[data-act="case-open"]');if(b)b.textContent=S.cs.open?'Close the case':'Open the case';
}
function toggleCase(){
  const cur=byId(S.open); if(cur&&cur.status==='waiting')return;
  S.cs.open=!S.cs.open;
  if(S.cs.open){S.cs.ry=Math.round(S.cs.ry/360)*360-10;S.cs.rx=4}
  applyCase();
}
function flipCase(){
  if(S.cs.open)S.cs.open=false;
  S.cs.ry=S.cs.ry+180;applyCase();
}
let cdrag=null;
document.addEventListener('pointerdown',e=>{
  const st=e.target.closest&&e.target.closest('.case-stage'); if(!st||st.classList.contains('locked')||e.target.closest('.disc'))return;
  cdrag={c:$('.case3d',st),x:e.clientX,y:e.clientY,ry:S.cs.ry,rx:S.cs.rx,moved:false,target:e.target};
});
document.addEventListener('pointermove',e=>{
  if(!cdrag)return; const dx=e.clientX-cdrag.x,dy=e.clientY-cdrag.y;
  if(!cdrag.moved&&Math.hypot(dx,dy)<6)return;
  if(!cdrag.moved){cdrag.moved=true;cdrag.c.classList.add('dragging')}
  S.cs.ry=cdrag.ry+dx*.6;S.cs.rx=Math.max(-28,Math.min(28,cdrag.rx-dy*.3));applyCase();
});
document.addEventListener('pointerup',e=>{
  if(!cdrag)return; const d=cdrag;cdrag=null;d.c.classList.remove('dragging');
  if(!d.moved&&d.target.closest&&d.target.closest('.f-out,.f-in'))toggleCase();
});
document.addEventListener('pointercancel',()=>{if(cdrag){cdrag.c.classList.remove('dragging');cdrag=null}});

/* drag spines to reorder (only in "the order I added them") */
let dragId=null;
document.addEventListener('dragstart',e=>{
  const sp=e.target.closest&&e.target.closest('#cavity .sp[draggable="true"]'); if(!sp)return;
  dragId=sp.dataset.id;sp.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}
});
document.addEventListener('dragover',e=>{
  if(!dragId)return; const sp=e.target.closest&&e.target.closest('#cavity .sp'); if(!sp)return;
  const a=byId(dragId),b=byId(sp.dataset.id); if(!a||!b||a.status!==b.status)return;
  e.preventDefault();$$('#cavity .sp.over').forEach(x=>x!==sp&&x.classList.remove('over'));sp.classList.add('over');
});
document.addEventListener('drop',e=>{
  if(!dragId)return; const sp=e.target.closest&&e.target.closest('#cavity .sp'); if(!sp)return;
  e.preventDefault();
  const a=byId(dragId),b=byId(sp.dataset.id); if(!a||!b||a===b||a.status!==b.status)return;
  const from=S.items.indexOf(a),to=S.items.indexOf(b);
  S.items.splice(from,1);S.items.splice(to,0,a);save();dragId=null;S.landed=null;fillShelf(true);
});
document.addEventListener('dragend',()=>{dragId=null;$$('#cavity .sp.dragging,#cavity .sp.over').forEach(x=>x.classList.remove('dragging','over'))});

/* ============================================================
   ENTRY PANEL — pulling one off the shelf
   ============================================================ */
function openEntry(id){
  const w=byId(id); if(!w)return;
  if(S.open!==id)S.cs={ry:-24,rx:5,open:false};
  S.open=id; renderPanel();
  $$('#cavity .sp').forEach(el=>el.classList.toggle('pulled',el.dataset.id===id));
  $$('#cavity .sp').forEach(el=>el.setAttribute('tabindex',el.dataset.id===id?'0':'-1'));
  $$('.idx tbody tr').forEach(tr=>tr.classList.toggle('open',tr.dataset.id===id));
}
function closeEntry(){
  const id=S.open; S.open=null;
  $('#panel').hidden=true;$('#panel').innerHTML='';$('#scrim').hidden=true;
  document.body.classList.remove('panel-open');
  $$('#cavity .sp.pulled').forEach(el=>el.classList.remove('pulled'));
  const el=id&&$(`.sp[data-id="${CSS.escape(id)}"]`);
  if(el)el.focus({preventScroll:true});
}
function renderPanel(){
  const it=byId(S.open), p=$('#panel');
  if(!it){closeEntry();return}
  const ws=wsorted(it), idx=S.order.indexOf(it.id);
  const wasOpen=!p.hidden, kept=wasOpen&&p.contains(document.activeElement)?document.activeElement.dataset.act:null;
  const waiting=it.status==='waiting';
  const hrs=ws.length?Math.round(ws.length*minsOf(it)/60*10)/10:0;
  p.hidden=false; $('#scrim').hidden=false;
  document.body.classList.add('panel-open');
  p.innerHTML=`
  <div class="pn-bar">
    <button type="button" class="step" data-act="prev" aria-label="Previous on the shelf">←</button>
    <button type="button" class="step" data-act="next" aria-label="Next on the shelf">→</button>
    <span class="pn-pos">${idx>=0?`${idx+1} of ${S.order.length}`:''}</span>
    <button type="button" class="tlink" data-act="close-panel">Close</button>
  </div>
  <div class="pn-body">
    ${caseHTML(it)}
    <h2 class="pn-title" id="pn-h">${esc(it.t)}${it.type==='series'?`<small>Season ${it.s}${!waiting&&it.eps?`, ${it.eps} episodes`:''}</small>`:''}</h2>
    <p class="byline">${waiting?`${it.type==='series'?'Series, season '+it.s:'Film'} · ${it.y||''}`:`${esc(kindText(it))} · ${it.y||''}`}${!waiting&&(it.dir||it.min)?' · ':''}${!waiting&&it.dir?`${it.type==='series'?'Created by':'Directed by'} ${esc(it.dir)} · `:''}${!waiting&&it.min?`${it.min} min${it.type==='series'?' an episode':''}`:''}${!waiting&&it.gen&&it.gen.length?` · ${esc(it.gen.join(', '))}`:''}</p>
    ${!waiting&&it.syn?`<p class="syn">${esc(it.syn)}</p>`:''}

    <section class="pn-sec" aria-label="${waiting?'Waiting in the wrapper':'Your copy'}">
      ${waiting?`<p class="wrapnote">${it.note?`“${esc(it.note)}”`:'Not yet. Saved for a good night.'}</p>
        <p class="byline">Added ${fmt(it.added)}. Its case, synopsis and details stay sealed until you’ve watched it.</p>
        <div class="pn-acts"><button class="btn" type="button" data-act="log" data-id="${esc(it.id)}">We watched it</button></div>`
      :`<div class="facts">
          <div><b>${ws.length}</b><span>${ws.length===1?'Evening':'Evenings'}</span></div>
          <div><b>${latestR(it)?rtxt(latestR(it)):'—'}</b><span>Latest rating</span></div>
          <div><b>${hrs}</b><span>Hours</span></div>
        </div>
        <ol class="ledger">${ws.map((w,i)=>{const gi=it.watches.indexOf(w);return `<li>

async function fetchArt(){
  const msg=$('#s-msg'); if(!TMDB.on()){msg.textContent='Add a TMDB key first.';return}
  const todo=S.items.filter(i=>!i.poster); if(!todo.length){msg.textContent='Every title already has its art.';return}
  let got=0,stop=false;
  for(let n=0;n<todo.length&&!stop;n++){
    const it=todo[n]; msg.textContent=`Finding art… ${n+1} of ${todo.length}`;
    try{
      const tv=it.type==='series', params={query:it.t,include_adult:'false',language:'en-GB'}; if(!tv&&it.y)params.year=it.y;
      const d=await TMDB.get(tv?'/search/tv':'/search/movie',params), nt=sortKey(it.t);
      const hit=d.results.find(r=>sortKey((tv?r.name:r.title)||'')===nt&&r.poster_path)||d.results.find(r=>r.poster_path);
      if(hit){
        it.poster=TMDB.poster(hit.poster_path);it.tmdb=(tv?'tv-':'movie-')+hit.id;
        if(tv&&it.s){try{const sd=await TMDB.get(`/tv/${hit.id}/season/${it.s}`);if(sd.poster_path)it.poster=TMDB.poster(sd.poster_path)}catch(_){}}
        got++;
      }
    }catch(e){if(e.message==='key'){msg.textContent='TMDB didn’t accept that key.';stop=true}}
  }
  save(); if(!stop)msg.textContent=`Found art for ${got} of ${todo.length}.`;
  if(S.view==='shelf')fillShelf(true);else fillIndex();
  if(S.open&&byId(S.open))renderPanel();
}

      <button type="button" class="btn line" data-act="example">Restore the example library</button>
      <button type="button" class="btn line" data-act="empty">Start with an empty shelf</button></div>
      <p class="fine">Everything is kept in this browser only. Taking a copy is the way to keep it safe.</p></div>
    <div class="formfoot"><button type="button" class="btn" data-act="settings-done">Done</button></div>
  </div>`);
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',e=>{
  const t=e.target;
  const sp=t.closest('#cavity .sp[data-id]'); if(sp){openEntry(sp.dataset.id);return}
  const q=t.closest('.quote[data-id]'); if(q){openEntry(q.dataset.id);return}
  const tr=t.closest('.idx tbody tr[data-id]'); if(tr){openEntry(tr.dataset.id);return}
  const f=t.closest('[data-filter]'); if(f){S.filter=(f.classList.contains('hl')&&S.filter===f.dataset.filter)?'all':f.dataset.filter;save();if(S.view==='index')fillIndex();else fillShelf();refreshHeader();return}
  const is=t.closest('[data-isort]'); if(is){const k=is.dataset.isort;S.isort=S.isort.k===k?{k,d:-S.isort.d}:{k,d:1};save();viewIndex();return}
  const b=t.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act;
  switch(act){
    case 'add': openAdd();break;
    case 'settings': openSettings();break;
    case 'theme': S.theme=S.theme==='dark'?'light':'dark';applyTheme();break;
    case 'close-panel': closeEntry();break;
    case 'prev': step(-1);break;
    case 'next': step(1);break;
    case 'col': setColour(+b.dataset.c);break;
    case 'case-open': toggleCase();break;
    case 'case-flip': flipCase();break;
    case 'spin': {b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');break}
    case 'pull': {const pool=S.order.filter(id=>{const i=byId(id);return i&&i.status==='seen'&&id!==S.open});
      if(!pool.length){toast('Nothing to pull out yet.');break}
      const id=pool[Math.floor(Math.random()*pool.length)];openEntry(id);
      const el=$(`#cavity .sp[data-id="${CSS.escape(id)}"]`);if(el)el.scrollIntoView({block:'center',behavior:reduceMotion()?'auto':'smooth'});break}
    case 'remove': removeItem(b.dataset.id);break;
    case 'rmwatch': removeWatch(+b.dataset.i);break;
    case 'log': {const it=byId(b.dataset.id);if(it){S.add=null;startForm(it,it.id)}break}
    case 'scrim': if(t===b)closeLayer();break;
    case 'sheet-close': case 'settings-done': closeLayer();break;
    case 'pick-tmdb': pickTmdb(+b.dataset.i);break;
    case 'pick': {const c=byId(b.dataset.cid)||catalogue().find(x=>x.id===b.dataset.cid);if(!c)break;const have=byId(c.id);startForm(have||c,have?have.id:null);break}
    case 'manual': startForm({id:'manual',t:b.dataset.q,y:0,type:'film',min:0,dir:'',gen:[],syn:'',col:hash(b.dataset.q)%SP.length,manual:true,watches:[]},null);break;
    case 'back': if(S.add&&S.add.exist){closeLayer()}else{closeLayer();openAdd()}break;
    case 'fmt': {syncForm();S.add.meta.type=b.dataset.v;$$('[data-act=fmt]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      $('#f-series').hidden=b.dataset.v!=='series';$('#f-dir').hidden=b.dataset.v==='series';
      $('#f-prev').innerHTML=spineHTML({...S.add.meta,col:S.add.d.col},{static:true});break}
    case 'status': {S.add.d.status=b.dataset.v;$$('[data-act=status]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      $('#f-seen').hidden=b.dataset.v!=='seen';$('#f-wait').hidden=b.dataset.v!=='waiting';
      $('#f-go').textContent=b.dataset.v==='seen'?'Put it on the shelf':'Put it in the wrapper';break}
    case 'date': {const v=addDays(TODAY,+b.dataset.v);$('#f-date').value=v;S.add.d.date=v;break}
    case 'who': {const v=b.dataset.v,w=S.add.d.who;
      if(!v){w.length=0}else{const i=w.indexOf(v);i>=0?w.splice(i,1):w.push(v)}
      $$('#f-who [data-act=who]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v?w.includes(x.dataset.v):!w.length)));break}
    case 'newwho': {const i=$('#f-newwho');i.hidden=false;i.focus();break}
    case 'norate': setRate(0);break;
    case 'fcol': {const i=+b.dataset.c;syncForm();S.add.d.col=i;$$('[data-act=fcol]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.c===i)));
      $('#f-prev').innerHTML=spineHTML({...S.add.meta,col:i},{static:true});break}
    case 'key-save': saveKey();break;
    case 'art': fetchArt();break;
    case 'export': {const blob=new Blob([JSON.stringify({exported:TODAY,lib:S.lib,people:S.people,items:S.items},null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`the-usual-${TODAY}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);break}
    case 'example': if(confirm('Replace your library with the example one? Your current shelf will be lost unless you took a copy.')){S.items=seedItems();save();closeLayer();closeEntry();route();toast('The example library is back.')}break;
    case 'empty': if(confirm('Clear the shelf and start again? This can’t be undone unless you took a copy.')){S.items=[];save();closeLayer();closeEntry();route();toast('A clean shelf. Start with the first one you loved.')}break;
    case 'settheme': S.theme=b.dataset.v;applyTheme();$$('[data-act=settheme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sh-q'){S.add.q=t.value;$('#sh-res').innerHTML=resultsHTML(t.value);queueSearch()}
  else if(t.id==='find'){S.q=t.value;applyFind()}
  else if(t.id==='s-a'){S.lib.a=t.value.trim()||'You';save();paintMast();const b=$('.deck p:last-child');if(b&&S.view==='shelf')b.innerHTML=sinceText()}
  else if(t.id==='s-b'){S.lib.b=t.value.trim();if(S.lib.b&&S.people[S.partner])S.people[S.partner].n=S.lib.b;save();paintMast();const b=$('.deck p:last-child');if(b&&S.view==='shelf')b.innerHTML=sinceText()}
  else if(t.closest('#addform')){syncForm(); if(t.id==='f-t'||t.id==='f-y'||t.id==='f-s'){const p=$('#f-prev');if(p)p.innerHTML=spineHTML({...S.add.meta,col:S.add.d.col},{static:true})}}
});
function applySeason(n){
  const a=S.add,m=a&&a.meta,x=m&&(m.seasons||[]).find(y=>y.n===n); if(!x)return;
  m.s=n;m.eps=x.eps||m.eps;m.poster=x.poster||m.showPoster||'';if(x.y)m.y=x.y;
  const c=$('#f-cover'),by=$('#f-by'),pv=$('#f-prev');
  if(c)c.innerHTML=coverHTML(m);
  if(by)by.textContent=`${kindText(m)} · ${m.y||''}${m.dir?' · '+m.dir:''}`;
  if(pv)pv.innerHTML=spineHTML({...m,col:a.d.col},{static:true});
}
document.addEventListener('change',e=>{
  if(e.target.id==='f-season'){applySeason(+e.target.value);return}
  if(e.target.id==='sort'){S.sort=e.target.value;save();fillShelf()}
});
document.addEventListener('submit',e=>{if(e.target.id==='addform'){e.preventDefault();submitForm()}});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){
    if($('#layer').innerHTML){closeLayer();e.preventDefault();return}
    if(S.open){closeEntry();return}
  }
  if(t.id==='f-newwho'&&e.key==='Enter'){
    e.preventDefault();const n=t.value.trim();if(!n)return;
    const k=n.toLowerCase().replace(/[^a-z0-9]/g,'')||('p'+Date.now());
    if(!S.people[k]){const cols=['--mauve','--blue','--champagne','--copper','--gold'];S.people[k]={n,c:cols[Object.keys(S.people).length%cols.length]}}
    syncForm();const d=S.add.d;if(!d.who.includes(k))d.who.push(k);save();
    const keep={...S.add};renderForm();return;
  }
  if(t.id==='sh-q'&&e.key==='Enter'){const f=$('#sh-res .res');if(f){e.preventDefault();f.click()}return}
  if(t.classList&&t.classList.contains('case-stage')){
    const k=e.key;
    if(k==='ArrowLeft'){e.preventDefault();S.cs.ry-=20;applyCase()}
    else if(k==='ArrowRight'){e.preventDefault();S.cs.ry+=20;applyCase()}
    else if(k==='ArrowUp'){e.preventDefault();S.cs.rx=Math.min(28,S.cs.rx+8);applyCase()}
    else if(k==='ArrowDown'){e.preventDefault();S.cs.rx=Math.max(-28,S.cs.rx-8);applyCase()}
    else if(k==='Enter'||k===' '){e.preventDefault();toggleCase()}
    return;
  }
  if(t.id==='f-rate'){
    if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();setRate(Math.min(5,(S.add.d.r||0)+.5))}
    if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();setRate(Math.max(0,(S.add.d.r||0)-.5))}
    return;
  }
  if(t.matches&&t.matches('.idx tbody tr')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openEntry(t.dataset.id);return}
  if(t.id==='find'&&e.key==='Escape'){t.value='';S.q='';applyFind();return}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if(e.key==='/'&&!typing&&!$('#layer').innerHTML){const f=$('#find');if(f){e.preventDefault();f.focus()}return}
  if(S.open&&!typing&&!$('#layer').innerHTML&&t.closest&&!t.closest('#panel')){
    if(e.key==='ArrowRight'&&!t.closest('#cavity')){step(1)}
    if(e.key==='ArrowLeft'&&!t.closest('#cavity')){step(-1)}
  }
  const sp=t.closest&&t.closest('#cavity .sp');
  if(sp&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){
    e.preventDefault();
    const all=$$('#cavity .sp'),i=all.indexOf(sp);let n=null;
    if(e.key==='ArrowLeft')n=all[i-1];else if(e.key==='ArrowRight')n=all[i+1];
    else if(e.key==='Home')n=all[0];else if(e.key==='End')n=all[all.length-1];
    else{
      const rows=$$('#cavity .row'),ri=rows.findIndex(r=>r.contains(sp)),tr=rows[ri+(e.key==='ArrowUp'?-1:1)];
      if(tr){const x=sp.getBoundingClientRect().left;const c=$$('.sp',tr);n=c.sort((a,b)=>Math.abs(a.getBoundingClientRect().left-x)-Math.abs(b.getBoundingClientRect().left-x))[0]}
    }
    if(n){sp.setAttribute('tabindex','-1');n.setAttribute('tabindex','0');n.focus()}
  }
});
/* rating pointer handling */
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('#f-rate'); if(!el)return;
  const v=rateFrom(e,el); setRate(S.add.d.r===v?0:v);
});
document.addEventListener('pointermove',e=>{
  const el=e.target.closest&&e.target.closest('#f-rate'); if(!el||e.pointerType==='touch')return;
  el.style.setProperty('--p',rateFrom(e,el)/5*100+'%');
});
document.addEventListener('pointerout',e=>{
  const el=e.target.closest&&e.target.closest('#f-rate'); if(!el)return;
  el.style.setProperty('--p',(S.add.d.r||0)/5*100+'%');
});
window.addEventListener('hashchange',()=>{ if(S.open)closeEntry(); route() });

/* ============================================================
   BOOT
   ============================================================ */
load();
applyTheme();
route();
</script>
